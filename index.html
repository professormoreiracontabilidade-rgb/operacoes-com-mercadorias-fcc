<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101450"><title>FCC • Operações com Mercadorias | Professor Moreira</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 10% 10%,#293ed4,transparent 38%),radial-gradient(circle at 90% 85%,#6028b2,transparent 40%),#0b1052;color:#fff;font-family:system-ui,Arial,sans-serif}main{max-width:1000px;margin:auto;min-height:100dvh;padding:14px;display:flex;flex-direction:column;gap:12px}.brand{text-align:center;color:#ffe636;font-size:clamp(15px,3vw,25px);font-weight:1000;letter-spacing:.3px}.panel{background:#101c70;border:3px solid #ffe12d;border-radius:22px;padding:clamp(16px,3vw,30px);box-shadow:0 15px 30px #05052980}.cover{text-align:center;padding:28px 4px}.cover h1{font-size:clamp(34px,8vw,62px);line-height:1.08;color:#ffe12d}.cover h2{font-size:clamp(25px,5vw,42px)}.cover p{font-size:clamp(18px,3vw,25px)}.eyebrow{color:#ffe12d;font-size:clamp(23px,5vw,38px);font-weight:950}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.quizbtn{border:0;border-radius:16px;background:#ffe12d;color:#101450;padding:20px 8px;font-size:22px;font-weight:950;cursor:pointer}.quizbtn small{font-size:15px}.head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:#ffe12d;font-size:clamp(17px,3vw,23px);font-weight:900}.source{font-size:clamp(13px,2vw,17px);opacity:.85;margin-top:8px}.bar{background:#060c3c;border-radius:12px;height:10px;margin-top:12px;overflow:hidden}.bar>div{background:#ffe12d;height:100%}.stem{white-space:pre-wrap;font-size:clamp(19px,3vw,25px);line-height:1.47;margin:20px 0}.opt{display:block;width:100%;text-align:left;white-space:pre-wrap;font-family:inherit;font-size:clamp(18px,2.7vw,23px);line-height:1.4;border:2px solid #9db0ff;border-radius:14px;background:#20369e;color:#fff;padding:14px;margin:10px 0;cursor:pointer}.opt strong{color:#ffe12d}.opt.correct{background:#077e4b;border-color:#80ffb2}.opt.wrong{background:#aa1941;border-color:#ff8aa4}.opt:disabled{cursor:default}.explain{background:#08134c;border:2px solid #ffe12d;border-radius:15px;padding:18px;white-space:pre-wrap;line-height:1.5;font-size:clamp(17px,2.6vw,21px);margin-top:16px}.explain h3{margin:0 0 12px;color:#ffe12d}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:12px 0;margin-top:auto}.actions button{flex:1 1 135px;border:0;border-radius:13px;background:#ffe12d;color:#111752;font-size:clamp(16px,2.4vw,21px);font-weight:900;padding:14px 10px;cursor:pointer}.actions button.alt{background:#e7edff}.score{font-size:clamp(40px,9vw,75px);font-weight:1000;color:#ffe12d}.foot{text-align:center;font-size:14px;opacity:.75;padding:0 0 15px}</style></head><body><main><div class="brand">CURSO DE CONTABILIDADE PROFESSOR MOREIRA</div><section class="panel" id="screen"></section><nav class="actions" id="actions"></nav><div class="foot">Questões FCC • Gabaritos conforme arquivo fornecido</div></main><script>const DATA=[[{"number": 1, "source": "FCC - Ges Gov (SAD PE)/SAD PE/Administrativa/Contador/2026", "statement": "Uma empresa comercial adquiriu um estoque de mercadorias e as informações sobre a compra são as seguintes:\n \n\n- A compra ocorreu em 01/12/2022.\n\n- O valor da compra foi R$ 2.890.800 para pagamento após 19 meses,\n\n- A empresa contratou uma transportadora para levar as mercadorias do depósito do fornecedor até seu próprio depósito e pagou, à vista, R$ 30.000.\n \n\nO valor total dos tributos recuperáveis que estão incluídos nos gastos efetuados pela empresa era R$ 138.000 e o valor dos tributos não recuperáveis era R$ 96.000.\n\nA taxa de juros vigente era 0,5% ao mês que é equivalente a 10% para o período de 19 meses.\n \n\nSabendo-se que a empresa não vendeu qualquer quantidade do estoque adquirido, o valor contábil líquido registrado para os Estoques (no ativo circulante) e para o saldo a pagar aos Fornecedores (no passivo não circulante), no Balanço Patrimonial de 31/12/2022, foram, respectivamente, em reais:", "options": {"A": "2.533.140 e 2.641.140.", "B": "2.782.800 e 2.890.800.", "C": "2.920.800 e 2.890.800.", "D": "2.520.000 e 2.641.140.", "E": "2.520.000 e 2.520.000."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 2.520.000 e 2.641.140.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 2, "source": "FCC - AFRE (SEFAZ SP)/SEFAZ SP/Gestão Tributária/2026", "statement": "A Cia. Enrolada adquiriu, em 30/11/2025, produtos para serem comercializados. Em função de sua situação financeira, a Cia. adquiriu estes produtos por R$ 480.000 para serem pagos em 30/11/2026, mas, se a Cia. tivesse adquirido estes produtos à vista, teria pagado R$ 400.000. Em 10/12/2025, a Cia. Enrolada vendeu 80% desses produtos por R$ 1.020.000, para serem recebidos integralmente em 10/12/2026. Sabe-se que a empresa concede, normalmente, um prazo de 90 dias para seus clientes e que se o cliente tivesse adquirido as mercadorias à vista teria pagado R$ 850.000.\n \n\nCom base nessas informações, a Cia. Enrolada reconheceu", "options": {"A": "Receita de vendas no valor de R$ 850.000 e Custo dos produtos vendidos no valor de R$ 320.000, na data da venda.", "B": "Receita de vendas no valor de R$ 850.000, Custo dos produtos vendidos no valor de R$ 320.000 e Resultado financeiro positivo no valor de R$ 90.000, na data da venda.", "C": "Estoques no valor de R$ 480.000, na data da aquisição.", "D": "Receita financeira no valor de R$ 170.000, no mês de dezembro de 2025.", "E": "Receita de vendas no valor de R$ 1.020.000 e Custo dos produtos vendidos no valor de R$ 320.000, na data da venda."}, "answer": "A", "explanation": "Gabarito fornecido: A.\n\nAlternativa indicada: Receita de vendas no valor de R$ 850.000 e Custo dos produtos vendidos no valor de R$ 320.000, na data da venda.\n\nFundamentação: Quando houver componente financeiro significativo, a compra ou venda é reconhecida inicialmente pelo equivalente à vista. A diferença entre o valor a prazo e o valor à vista é apropriada como receita ou despesa financeira ao longo do prazo. Fretes de entrada e tributos recuperáveis seguem as regras do CPC 16.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 3, "source": "FCC - AFRE (SEFAZ SP)/SEFAZ SP/Gestão Tributária/2026", "statement": "Em 30/10/2025, uma empresa importadora adquiriu um lote de mercadorias, de um fornecedor no exterior, e incorreu nos seguintes gastos:\n \n\n• R$ 2.300.000, pagos ao fornecedor da mercadoria.\n \n\n• R$ 300.000, pagos à transportadora para trazer a mercadoria para o Brasil.\n \n\n• R$ 80.000 de imposto de importação.\n \n\n• R$ 120.000 de taxas, tarifas e impostos para desembaraço das mercadorias.\n \n\n• R$ 60.000, pagos à seguradora para garantir o recebimento das mercadorias.\n \n\n• R$ 40.000 para o transporte da mercadoria do porto até a empresa.\n \n\nNos valores pagos pela empresa estão incluídos:\n \n\n• Tributos recuperáveis no valor de R$ 160.000.\n \n\n• Tributos não recuperáveis no valor de R$ 50.000.\n \n\nSabendo que a empresa vendeu, em novembro e dezembro de 2025, 80% das mercadorias adquiridas, o Custo das Mercadorias Vendidas evidenciado na Demonstração do Resultado do ano de 2025 da empresa, em relação à compra e venda das mercadorias citadas, foi, em reais,", "options": {"A": "2.032.000.", "B": "2.320.000.", "C": "2.152.000.", "D": "2.192.000.", "E": "2.096.000."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 2.192.000.\n\nFundamentação: CMV = estoque inicial + compras líquidas − estoque final. Em lote único, pode-se calcular custo de aquisição × percentual vendido. Custo de aquisição inclui frete e seguro de entrada e tributos não recuperáveis, excluindo tributos recuperáveis e descontos comerciais obtidos.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 4, "source": "FCC - ARSPD (ARPE)/ARPE/Contabilidade/2026", "statement": "A empresa Perfumes Importados S.A. não possuía estoque de produtos no dia 01/12/2024. Nessa data, adquiriu mercadorias para revenda pelo valor total de R$ 1.800.000 que foi pago à vista. No valor total estavam incluídos tributos recuperáveis de R$ 180.000 e tributos não recuperáveis de R$ 360.000, e a empresa pagou, adicionalmente, o custo do transporte destas mercadorias até o seu depósito, cujo valor foi R$ 120.000.\n \n\nSe no ano de 2024 a empresa vendeu setenta por cento (70%) do estoque adquirido em 01/12/2024, o valor que a empresa Perfumes Importados S.A. evidenciou como valor contábil do estoque, após as baixas pelas vendas, foi, em reais,", "options": {"A": "468.000.", "B": "414.000.", "C": "576.000.", "D": "522.000.", "E": "486.000."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 522.000.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 5, "source": "FCC - AFRE GO/SEFAZ GO/2026", "statement": "Uma empresa adquiriu, à vista, um lote de mercadorias pelo valor de R$ 1.000.000. A compra foi realizada em 18/11/2024 e a empresa compradora responsabilizou-se pela retirada das mercadorias no depósito do fornecedor, pagando R$ 40.000 de frete para transportar essas mercadorias até seu depósito. A empresa pagou, adicionalmente, o valor de R$ 10.000 por um seguro contra roubo das mercadorias durante esse transporte. Nos diversos valores pagos estão incluídos impostos recuperáveis no valor de R$ 90.000 e impostos não recuperáveis no valor de R$ 70.000. Em 15/12/2024, a empresa vendeu 80% das mercadorias que havia comprado.\n \n\nO saldo evidenciado na conta Estoques, no Balanço Patrimonial de 31/12/2024, em relação exclusivamente a essas mercadorias, foi, em reais,", "options": {"A": "192.000", "B": "178.000", "C": "182.000", "D": "184.000", "E": "190.000"}, "answer": "A", "explanation": "Gabarito fornecido: A.\n\nAlternativa indicada: 192.000\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 6, "source": "FCC - ALC (CM Pres Prudente)/CM Pres Prudente/2026", "statement": "Acerca do tratamento contábil para os estoques à luz do CPC 16 (R1),", "options": {"A": "os gastos envolvidos no esforço de comercialização dos estoques (como frete e comissões de vendas) devem ser considerados como custo dos estoques.", "B": "os estoques devem ser valorados obrigatoriamente pelo critério “Último a Entrar, Primeiro a Sair” (UEPS).", "C": "os custos de transformação de estoques incluem tanto aqueles diretamente atribuíveis com as unidades produzidas quanto a alocação sistemática de custos indiretos de produção.", "D": "os estoques devem ser avaliados pelo valor de custo ou pelo valor realizável líquido, dos dois o maior.", "E": "o custo de aquisição dos estoques compreende o preço de compra líquido de impostos recuperáveis e não-recuperáveis, assim como outros custos diretamente atribuíveis ao item adquirido."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: os custos de transformação de estoques incluem tanto aqueles diretamente atribuíveis com as unidades produzidas quanto a alocação sistemática de custos indiretos de produção.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 7, "source": "FCC - Cont (Fundação Florestal)/Fundação Florestal/2026", "statement": "O método das partidas dobradas implica que cada evento gera o registro de um ou mais débitos em contrapartida de um ou mais créditos em contas, devendo a soma dos valores registrados nos débitos ser igual à soma dos valores registrados nos créditos.\n \n\nA forma correta de registro para cada evento mencionado é:", "options": {"A": "Estoques contabilizados por R$ 55.000, mas com valor realizável líquido de R$ 45.000.\nDébito – Perdas por redução a valor realizável de Estoques (Resultado) ............................................................................ 10.000\nCrédito – Perdas estimadas para redução ao valor recuperável (conta redutora de Estoque no Ativo) ........................................ 10.000", "B": "Atualização do valor justo de uma Propriedade para Investimento, anteriormente avaliada em R$ 15.000 e, agora, em R$ 18.000.\nDébito – Propriedade para Investimento (Ativo) .................................................................................................................... 18.000\nCrédito – Avaliação a valor justo (Resultado) ......................................................................................................................... 18.000", "C": "Retenção de 5% do Lucro Líquido de 100.000 como Reserva Legal.\nDébito – Lucros Acumulados (PL) ........................................................................................................................................... 5.000\nCrédito – Reserva de Capital (PL) .......................................................................................................................................... 5.000", "D": "Pagamento de 80% do saldo de fornecedores, de R$ 40.000, pela compra de produtos para revenda.\nDébito – Estoque (Ativo) ........................................................................................................................................................ 32.000\nCrédito – Caixa (Ativo) ........................................................................................................................................................... 32.000", "E": "Registro do tributo diferido relacionado a uma diferença temporária tributável de R$ 500, considerando a alíquota de 30%.\nDébito – Tributos diferidos (Ativo) ............................................................................................................................................ 150\nCrédito – Receita de IR/CS Diferido (Resultado) ................................................................................................................... 150"}, "answer": "A", "explanation": "Gabarito fornecido: A.\n\nAlternativa indicada: Estoques contabilizados por R$ 55.000, mas com valor realizável líquido de R$ 45.000.\nDébito – Perdas por redução a valor realizável de Estoques (Resultado) ............................................................................ 10.000\nCrédito – Perdas estimadas para redução ao valor recuperável (conta redutora de Estoque no Ativo) ........................................ 10.000\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 8, "source": "FCC - AFTM (Pref Manaus)/Pref Manaus/2026", "statement": "A empresa “Guarda tudo” tinha, em 31/12/20X3, estoques no valor total de R$ 15.000,00 relacionados a 200 unidades de um produto já acabado. Em 20X4, a empresa adquiriu matérias-primas no valor total de R$ 3.000,00 para a produção de novas mercadorias, valor esse que inclui impostos recuperáveis no valor total de R$ 200,00. Além disso, pagou custos de transporte no valor total de R$ 100,00, custos totais de transformação de R$ 1.000,00 e despesas de comercialização totais de R$ 150,00. Os novos produtos elaborados em 20X4 representam 50 novas unidades de produtos acabados.\n \n\nApós a elaboração dos novos produtos, a empresa vendeu 125 unidades. O critério de valoração de estoque utilizado pela “Guarda tudo” é o de custo médio ponderado.\n \n\nO valor realizável líquido desse estoque é de R$ 9.550,00.\n \n\nCom base apenas nessas informações e no que estabelece o CPC 16 (R1) – Estoques, o saldo final de Estoques da “Guarda tudo” em 31/12/20X4 é de", "options": {"A": "R$ 9.500,00", "B": "R$ 9.000,00", "C": "R$ 9.450,00", "D": "R$ 9.550,00", "E": "R$ 9.725,00"}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: R$ 9.450,00\n\nFundamentação: CPC 16: o estoque deve ser apresentado pelo menor valor entre custo e valor realizável líquido (VRL). VRL = preço estimado de venda menos gastos necessários para concluir e vender. Se o VRL cair abaixo do custo, reconhece-se perda no resultado; eventual reversão é limitada ao custo original.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 9, "source": "FCC - AJ TRT1/TRT 1/Administrativa/Contabilidade/2025", "statement": "Em 01/12/2022, a empresa Comércio de Produtos para PET S.A. adquiriu mercadorias para revenda. O valor total pago, à vista, foi R$ 600.000,00, sendo que nesse valor estavam incluídos tributos recuperáveis de R$ 60.000,00 e tributos não recuperáveis de R$ 120.000,00. A empresa arcou, adicionalmente, com o custo do transporte dessas mercadorias até o seu depósito, cujo valor foi R$ 40.000,00.\n \n\nSabendo que a empresa vendeu, ainda no ano de 2022, setenta por cento (70%) do estoque de mercadorias adquirido em 01/12/2022, o valor que a empresa Comércio de Produtos para PET S.A. reconheceu como Custo da Mercadoria Vendida, especificamente em relação a essa compra, foi:", "options": {"A": "R$ 322.000,00", "B": "R$ 448.000,00", "C": "R$ 378.000,00", "D": "R$ 406.000,00", "E": "R$ 364.000,00"}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: R$ 406.000,00\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 10, "source": "FCC - Ag Trib (SEFAZ PI)/SEFAZ PI/Geral/2025", "statement": "Para responder a questão abaixo, utilize as informações a seguir :\n \n\nEm 02/12/2022, a empresa Compra e Venda S.A. adquiriu determinada mercadoria para revenda e pagou, à vista, os seguintes valores:\n \n\n- Para o fornecedor das mercadorias: R$ 300.000,00.\n\n- Para a empresa que transportou as mercadorias do depósito do fornecedor até seu depósito: R$ 20.000,00.\n \n\nO valor total dos tributos recuperáveis incluídos nos valores pagos foi R$ 40.000,00.\n \n\nEm 22/12/2022, a empresa vendeu 80% das mercadorias que haviam sido adquiridas e pagou R$ 30.000,00 para a transportadora que fez a entrega das mercadorias vendidas.\n \n\nO saldo contábil da conta Estoques, após a venda e entrega das mercadorias vendidas, registrado no Balanço Patrimonial de 31/12/2022 da empresa Compra e Venda S.A., especificamente em relação às mercadorias citadas, era", "options": {"A": "R$ 52.000,00", "B": "R$ 60.000,00", "C": "R$ 64.000,00", "D": "R$ 56.000,00", "E": "R$ 62.000,00"}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: R$ 56.000,00\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}], [{"number": 11, "source": "FCC - Ag Trib (SEFAZ PI)/SEFAZ PI/Geral/2025", "statement": "Para responder a questão abaixo, utilize as informações a seguir :\n \n\nEm 02/12/2022, a empresa Compra e Venda S.A. adquiriu determinada mercadoria para revenda e pagou, à vista, os seguintes valores:\n \n\n- Para o fornecedor das mercadorias: R$ 300.000,00.\n\n- Para a empresa que transportou as mercadorias do depósito do fornecedor até seu depósito: R$ 20.000,00.\n \n\nO valor total dos tributos recuperáveis incluídos nos valores pagos foi R$ 40.000,00.\n \n\nEm 22/12/2022, a empresa vendeu 80% das mercadorias que haviam sido adquiridas e pagou R$ 30.000,00 para a transportadora que fez a entrega das mercadorias vendidas.\n \n\nO valor do Custo das Mercadorias Vendidas registrado no resultado de 2022 da empresa Compra e Venda S.A., especificamente em relação à venda das mercadorias citadas, foi", "options": {"A": "R$ 248.000,00", "B": "R$ 208.000,00", "C": "R$ 240.000,00", "D": "R$ 256.000,00", "E": "R$ 224.000,00"}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: R$ 224.000,00\n\nFundamentação: CMV = estoque inicial + compras líquidas − estoque final. Em lote único, pode-se calcular custo de aquisição × percentual vendido. Custo de aquisição inclui frete e seguro de entrada e tributos não recuperáveis, excluindo tributos recuperáveis e descontos comerciais obtidos.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 12, "source": "FCC - Ana (COPERGÁS)/COPERGÁS/Contador/2023", "statement": "A empresa Crystal S.A. adquiriu mercadorias para revenda no valor de R$ 150.000 à vista, sendo que dentro desse valor estão inclusos tributos recuperáveis de R$ 15.000. A empresa Crystal S.A. também teve que desembolsar R$ 5.000 de frete, e R$ 1.500 para uma seguradora, para garantir o transporte das mercadorias até o seu depósito.\n \n\nCom base no Pronunciamento Técnico CPC 02 – Estoques, o valor a ser registrado na conta de Estoques da empresa Crystal S.A. é, em reais:", "options": {"A": "141.500.", "B": "156.500.", "C": "140.000.", "D": "155.000.", "E": "150.000."}, "answer": "A", "explanation": "Gabarito fornecido: A.\n\nAlternativa indicada: 141.500.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 13, "source": "FCC - Ana (COPERGÁS)/COPERGÁS/Economista/2023", "statement": "O estoque da empresa Pureza S.A. estava registrado na contabilidade em 31/12/X0 pelo custo de aquisição de R$ 250.000. Ao final do ano de X1 a empresa não havia vendido o estoque, mas verificou que o valor de venda era R$ 230.000 e as despesas para concretizar a venda totalizavam R$ 10.000. Ao final do ano de X2 o estoque ainda não tinha sido vendido e seu valor realizável líquido era 260.000.\n \n\nOs valores a serem apresentados para a conta Estoques, nos Balanços Patrimoniais da empresa Pureza S.A. em 31/12/X1 e em 31/12/X2, são, respectivamente, em reais:", "options": {"A": "230.000 e 250.000.", "B": "220.000 e 260.000.", "C": "220.000 e 250.000.", "D": "230.000 e 260.000.", "E": "220.000 e 220.000."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 220.000 e 250.000.\n\nFundamentação: CPC 16: o estoque deve ser apresentado pelo menor valor entre custo e valor realizável líquido (VRL). VRL = preço estimado de venda menos gastos necessários para concluir e vender. Se o VRL cair abaixo do custo, reconhece-se perda no resultado; eventual reversão é limitada ao custo original.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 14, "source": "FCC - AJ (TJ BA)/TJ BA/Apoio Especializado/Contador/2023", "statement": "Em abril de 20X1, a tapeçaria Noronha adquiriu insumos para sua produção, especificamente, novelos de lã natural premium tingidos artificialmente. A mercadoria foi adquirida pelo valor de R$ 360.000,00, o qual inclui 15% de impostos não recuperáveis e considera um desconto comercial aplicado de 10%.\n \n\nA empresa arcou ainda com gastos com transporte de R5 10.000,00, seguro de R$ 20.000,00 e manuseio para colocá-lo em condições de uso de RS 2.400,00. A tapeçaria Noronha também incorreu em gastos com mão de obra direta no valor de R$ 5.000,00 para separar os fios para a produção de uma encomenda de tapetes.\n \n\nA tapeçaria Noronha é uma empresa que segue as normas internacionais para a elaboração de suas demonstrações contábeis. Assim, os estoques de fios de lã natural premium adquiridos em abril de 20X1 foram registrados inicialmente no ativo da empresa pelo valor, em reais, de", "options": {"A": "400.000,00", "B": "343.400,00", "C": "306.000,00", "D": "437.400,00", "E": "392.400,00"}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: 392.400,00\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 15, "source": "FCC - AJ TRT15/TRT 15/Administrativa/Contabilidade/2023", "statement": "Uma empresa comercial adquiriu, de estabelecimento de empresa fornecedora localizada no mesmo Município, mercadorias para serem revendidas a consumidores finais. Na Nota Fiscal do seu fornecedor, constavam os seguintes dados:\n\n\nI. Valor das mercadorias: R$ 2.500,00.\nII. Valor do frete cobrado do adquirente: R$ 500,00.\nIII. Alíquota de ICMS: 18%.\nIV. Valor total da Nota Fiscal: R$ 3.000,00.\n \n\nConsiderando que o ICMS é um imposto recuperável para a empresa comercial adquirente, o valor do ICMS a recuperar e o valor contábil dos estoques das mercadorias adquiridas são, respectivamente, de:", "options": {"A": "R$ 450,00 e de R$ 2.550,00", "B": "R$ 630,00 e de R$ 3.500,00", "C": "R$ 540,00 e de R$ 3.000,00", "D": "R$ 450,00 e de R$ 3.000,00", "E": "R$ 540,00 e de R$ 2.460,00"}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: R$ 540,00 e de R$ 2.460,00\n\nFundamentação: Verifique se cada tributo é recuperável e qual regime tributário se aplica. Em regra, tributos recuperáveis geram direito a crédito e não integram o custo do estoque; tributos não recuperáveis integram o custo quando diretamente atribuíveis à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 16, "source": "FCC - AJ TRT23/TRT 23/Administrativa/Contabilidade/2022", "statement": "NÃO deve ser reconhecido como custo dos estoques de produtos adquiridos ou produzidos", "options": {"A": "Imposto de importação da mercadoria adquirida no exterior.", "B": "Gastos com transporte da mercadoria adquirida.", "C": "Gastos com comercialização do produto produzido.", "D": "Valor a pagar do preço de aquisição da mercadoria.", "E": "Gastos relativos à transformação da mercadoria em um novo produto."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: Gastos com comercialização do produto produzido.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 17, "source": "FCC - AJ TRT5/TRT 5/Administrativa/Contabilidade/2022", "statement": "A empresa TecnoInfo S.A. vende o produto Tech, o qual está registrado em estoque pelo custo de R$ 250.000. Entretanto, no final do ano de 20X1, surgiu no mercado uma nova tecnologia mais moderna, que fez com que a empresa TecnoInfo S.A. tivesse que reduzir o preço de venda do Tech para R$ 220.000. Além disso, para que a venda se concretize, a empresa TecnoInfo S.A. incorrerá em custos adicionais de R$ 10.000.\n \n\nCom base nessas informações, o valor em Reais (R$) do ajuste a ser reconhecido nos estoques ao final de 20X1, bem como o lançamento contábil correspondente, são:", "options": {"A": "30.000; débito em conta de resultado e crédito em conta redutora da conta de estoques.", "B": "40.000; débito em conta de resultado e crédito em conta redutora da conta de estoques.", "C": "10.000; débito em conta de resultado e crédito em conta redutora da conta de estoques.", "D": "40.000; débito na conta de estoques e crédito em caixa.", "E": "30.000; débito na conta de estoques e crédito em caixa."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 40.000; débito em conta de resultado e crédito em conta redutora da conta de estoques.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 18, "source": "FCC - Ass Leg (ALAP)/ALAP/Atividade Orçamentária e Financeira/Assistente de Contabilidade/2020", "statement": "Em 10/Janeiro/X3, a Bolacha&Biscoito, uma distribuidora de alimentos, sofreu uma inundação em um dos seus centros de distribuição, por conta das fortes chuvas de verão. Na mesma data, os estoques estavam avaliados no Balanço Patrimonial da companhia no montante de R$ 200.000,00.\n \n\nEntretanto, a partir da avaliação do estoque feita por engenheiros nos dias posteriores à calamidade, estimou-se que o valor máximo que esse estoque poderá ser vendido é de R$ 50.000,00.\n \n\nA luz do CPC 16 (R1) − Estoques, o lançamento contábil a ser feito pela Bolacha&Biscoito referente aos estoques do centro de distribuição avariado é", "options": {"A": "Débito: Estoques (ativo) = R$ 150.000,00.\n\nCrédito: Perdas por redução ao valor realizável líquido de estoques (resultado) = R$ 150.000,00", "B": "Débito: Perdas por redução ao valor realizável líquido de estoques (resultado) = R$ 150.000,00\n\nCrédito: Estoques (ativo) = R$ 150.000,00", "C": "Débito: Estoques (ativo) = R$ 150.000,00.\n\nCrédito: Perdas por redução ao valor realizável líquido de estoques (conta redutora de ativo) = R$ 150.000,00", "D": "Débito: Perdas por redução ao valor realizável líquido de estoques (conta redutora de ativo) = R$ 150.000,00\n\nCrédito: Caixa (ativo) = R$ 150.000,00", "E": "Débito: Caixa (ativo) = R$ 150.000,00\n\nCrédito: Estoques (ativo) = R$ 150.000,00"}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: Débito: Perdas por redução ao valor realizável líquido de estoques (resultado) = R$ 150.000,00\n\nCrédito: Estoques (ativo) = R$ 150.000,00\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 19, "source": "FCC - Ass Leg (ALAP)/ALAP/Atividade Orçamentária e Financeira/Assistente de Contabilidade/2020", "statement": "Uma certa empresa divulgou a seguinte Demonstração do Resultado do Exercício para o ano de 20X7, com valores em reais,,\n \nReceita de Vendas \t175.000,00\n(−) Custo da Mercadoria Vendida \t105.000,00\nLucro Bruto \t70.000,00\n(−) Despesas de vendas \t8.750,00\n(−) Despesas administrativas \t28.000,00\n(−) Outras Despesas Operacionais \t8.750,00\nLucro antes do Imposto de Renda \t24.500,00\n(−) Imposto de Renda \t5.250,00\nLucro Líquido \t19.250,00\n \n\nA empresa iniciou o ano de 20X7 com um saldo de estoque no valor de R$ 25.000,00. Durante o exercício fiscal, foram feitas compras no montante de R$ 125.000,00. O saldo final de estoque em 31/12/20X7 para essa empresa é, em reais,", "options": {"A": "45.000,00.", "B": "150.000,00.", "C": "125.000,00.", "D": "105.000,00.", "E": "5.000,00."}, "answer": "A", "explanation": "Gabarito fornecido: A.\n\nAlternativa indicada: 45.000,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 20, "source": "FCC - AG (Pref Recife)/Pref Recife/Contábil/2019", "statement": "A Cia. Vende & Revende comprou, à vista, mercadorias no valor de R$ 280.000,00, obtendo um desconto de R$ 14.000,00 em função do volume. Adicionalmente, incorreu nos seguintes gastos que foram pagos à parte:\n\n\n− Imposto de importação no valor de R$ 20.000,00.\n− Gasto com transporte das mercadorias até a empresa no valor de R$ 8.000,00.\n− Gastos com seguros para transporte das mercadorias até a empresa no valor de R$ 3.000,00.\n− IPI não recuperável no valor de R$ 6.000,00.\n− ICMS recuperável no valor de R$ 9.000,00.\n\n\nO valor atribuído ao estoque das mercadorias adquiridas pela Cia. Vende & Revende foi, em reais,", "options": {"A": "312.000,00.", "B": "297.000,00.", "C": "303.000,00.", "D": "286.000,00.", "E": "292.000,00"}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 303.000,00.\n\nFundamentação: Verifique se cada tributo é recuperável e qual regime tributário se aplica. Em regra, tributos recuperáveis geram direito a crédito e não integram o custo do estoque; tributos não recuperáveis integram o custo quando diretamente atribuíveis à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}], [{"number": 21, "source": "FCC - AFTM (Pref Manaus)/Pref Manaus/2019", "statement": "Os valores relacionados com as compras de mercadorias, por uma empresa, ocorridas durante o ano de 2018, foram os seguintes:\n\n\n− Pagamento efetuado para o fornecedor das mercadorias: R$ 431.250,00.\n− Pagamento de seguro para cobertura de riscos até a mercadoria chegar à sede da empresa: R$ 30.000,00\n− Valor do frete pago para transportar as mercadorias até a empresa: R$ 20.250,00.\n\n\nNos diversos valores pagos pela empresa, estão incluídos tributos recuperáveis no valor de R$ 33.750,00 e tributos não recuperáveis no valor de R$ 24.000,00.\n\n\nA empresa conseguiu negociar no ano abatimentos sobre as diversas compras efetuadas no valor de R$ 45.000,00. O estoque inicial de mercadorias estava registrado pelo valor de R$ 150.000,00 e no final do período o saldo apresentado era R$ 112.500,00.\n\n\nO custo das mercadorias vendidas (CMV) evidenciado no resultado do ano de 2018 foi, em reais,", "options": {"A": "390.000,00.", "B": "410.250,00.", "C": "420.000,00.", "D": "485.250,00.", "E": "440.250,00."}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: 440.250,00.\n\nFundamentação: CMV = estoque inicial + compras líquidas − estoque final. Em lote único, pode-se calcular custo de aquisição × percentual vendido. Custo de aquisição inclui frete e seguro de entrada e tributos não recuperáveis, excluindo tributos recuperáveis e descontos comerciais obtidos.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 22, "source": "FCC - Aud Fisc (SEFAZ BA)/SEFAZ BA/Administração, Finanças e Controle Interno/2019", "statement": "Uma empresa adquiriu no exterior, em 15/09/2018, mercadorias para comercialização no mercado brasileiro. Além do preço pago ao fornecedor no exterior, que foi R$ 3.000.000,00, a empresa arcou com os seguintes encargos para dispor das mercadorias em condições de venda:\n \n\n− R$ 300.000,00 de transporte marítimo internacional para trazer as mercadorias até o Brasil;\n\n− R$ 150.000,00 de taxas e tarifas alfandegárias para ingresso das mercadorias no Brasil, incluindo o imposto de importação;\n\n− R$ 45.000,00 de impostos locais que são compensados com os impostos incidentes no momento em que ocorre a venda das mercadorias; e\n\n− R$ 50.000,00 para transportar as mercadorias do porto até a sede da empresa.\n \n\nAntes dessa compra, a empresa não tinha nenhum item em estoque e, em novembro de 2018, vendeu 90% das mercadorias que haviam sido importadas. O valor bruto das vendas foi R$ 4.250.000,00 e os impostos incidentes sobre essas vendas totalizaram R$ 637.500,00. O Resultado Bruto com Mercadorias apurado pela empresa no ano de 2018, exclusivamente em relação às mercadorias importadas e vendidas, foi, em reais,", "options": {"A": "1.550.000,00.", "B": "462.500,00.", "C": "422.000,00.", "D": "777.500,00.", "E": "507.500,00."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 462.500,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 23, "source": "FCC - Tec Faz (Pref Manaus)/Pref Manaus/2019", "statement": "No dia 30/11/2018 uma empresa adquiriu mercadorias por R$ 150.000,00, tendo pago o valor à vista. A empresa incorreu, adicionalmente, nos seguintes gastos:\n\n\n− Frete para transporte das mercadorias até a empresa: R$ 3.000,00.\n− Seguro para o transporte até a empresa: R$ 1.200,00.\n\n\nNos diversos valores pagos pela empresa, estavam incluídos:\n\n\n− Tributos recuperáveis: R$ 12.000,00.\n− Tributos não recuperáveis: R$ 500,00.\n\n\nSabendo-se que a empresa não tinha estoque antes dessa compra e que nenhuma mercadoria foi vendida, o valor do Estoque evidenciado pela empresa no Balanço Patrimonial de 31/12/2018 foi, em reais,", "options": {"A": "150.000,00.", "B": "154.200,00.", "C": "153.000,00.", "D": "142.200,00.", "E": "154.700,00."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 142.200,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 24, "source": "FCC - TJ (TJ MA)/TJ MA/Técnico em Contabilidade/2019", "statement": "A Cia. Beija Flor adquiriu, em 01/12/2018, à vista, mercadorias destinadas à revenda por R$ 150.000,00, sendo que neste valor estavam incluídos tributos recuperáveis de R$ 15.000,00 e tributos não recuperáveis de R$ 30.000,00. Adicionalmente, a Cia. Beija Flor contratou e pagou seguro para o transporte destas mercadorias até o seu depósito, no valor de R$ 10.000,00.\n\n\nO valor que a Cia. Beija Flor reconheceu na conta Estoque, especificamente em relação a esta compra, em reais, foi de", "options": {"A": "160.000,00.", "B": "135.000,00.", "C": "145.000,00.", "D": "130.000,00.", "E": "115.000,00."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 145.000,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 25, "source": "FCC - Ana G (DPE AM)/DPE AM/Especializado de Defensoria/Ciências Contábeis/2018", "statement": "A Cia. Açúcar & Sal adquiriu produtos para serem utilizados no seu processo industrial. Os produtos foram adquiridos à vista pelo valor total de R$ 120.000,00. No valor pago pelos produtos estavam inclusos tributos recuperáveis de R$ 25.000,00 e tributos não recuperáveis de R$ 15.000,00. Na mesma data, a Cia. pagou frete e seguro no valor de R$ 8.000,00 para transporte dos produtos até a empresa. Na aquisição dos produtos, a Cia. Açúcar & Sal efetuou nas contas Caixa e Estoques os seguintes lançamentos:", "options": {"A": "Débito em Estoques e crédito em Caixa, ambos no valor de R$ 128.000,00.", "B": "Débito em Estoques e crédito em Caixa, ambos no valor de R$ 95.000,00.", "C": "Débito em Estoques no valor de R$ 95.000,00 e crédito em Caixa no valor de R$ 128.000,00.", "D": "Débito em Estoques no valor de R$ 80.000,00 e crédito em Caixa no valor de R$ 128.000,00.", "E": "Débito em Estoques no valor de R$ 103.000,00 e crédito em Caixa no valor de R$ 128.000,00."}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: Débito em Estoques no valor de R$ 103.000,00 e crédito em Caixa no valor de R$ 128.000,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 26, "source": "FCC - Ana (SABESP)/SABESP/Gestão/Contabilidade/2018", "statement": "A Cia. de Águas Marítimas adquiriu um estoque de mercadorias para revenda no valor de R$ 500.000,00. A compra foi realizada no dia 30/12/2017, o prazo para pagamento concedido pelo fornecedor foi de 300 dias e sabe-se que o preço das mercadorias seria R$ 453.000,00 se a compra fosse efetuada à vista. A Cia. de Águas Marítimas pagou, adicionalmente, R$ 7.000,00 referente a frete e seguro para retirada das mercadorias junto ao fornecedor. A Cia. possui um estudo estatístico confiável e auditado por empresa independente e avalia, por este modelo, que as perdas de estoque, em função do seu processo de armazenagem e distribuição, representa 2% do valor total de cada compra. Com base nestas informações, os valores líquidos reconhecidos pela Cia. de Águas Marítimas nas demonstrações contábeis de 2017 foram:", "options": {"A": "Estoque = 507.000,00; Fornecedores a Pagar = 500.000,00.", "B": "Estoque = 450.800,00; Fornecedores a Pagar = 453.000,00; Despesa com Impairment  = 9.200,00.", "C": "Estoque = 460.000,00; Fornecedores a Pagar = 500.000,00; Despesa Financeira = 47.000,00.", "D": "Estoque = 453.000,00; Fornecedores a Pagar = 500.000,00; Despesa com Frete = 7.000,00; Despesa Financeira = 47.000,00.", "E": "Estoque = 443.940,00; Fornecedores a Pagar = 453.000,00; Despesa com Frete = 7.000,00; Despesa com Impairment  = 9.060,00."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: Estoque = 450.800,00; Fornecedores a Pagar = 453.000,00; Despesa com Impairment  = 9.200,00.\n\nFundamentação: Quando houver componente financeiro significativo, a compra ou venda é reconhecida inicialmente pelo equivalente à vista. A diferença entre o valor a prazo e o valor à vista é apropriada como receita ou despesa financeira ao longo do prazo. Fretes de entrada e tributos recuperáveis seguem as regras do CPC 16.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 27, "source": "FCC - AFRE (SEF SC)/SEF SC/Auditoria e Fiscalização/2018", "statement": "A empresa Estocagem comprou, à vista, mercadorias para revenda no valor de R$ 100.000,00, com desconto de R$ 15.000,00 em função do volume. Adicionalmente, incorreu nos seguintes gastos:\n\n\n− Imposto de importação no valor de R$ 10.000,00.\n− Gastos com armazenamento para que a mercadoria chegue até a empresa no valor de R$ 15.000,00.\n− Gasto com transporte das mercadorias até a empresa no valor de R$ 5.000,00.\n− IPI não recuperável no valor de R$ 4.000,00.\n− ICMS recuperável no valor de R$ 7.000,00.\n− Gastos com seguros para transporte das mercadorias até a empresa no valor de R$ 3.000,00.\n\n\nO custo das mercadorias adquiridas foi, em reais,", "options": {"A": "137.000,00.", "B": "122.000,00.", "C": "129.000,00.", "D": "125.000,00.", "E": "107.000,00."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 122.000,00.\n\nFundamentação: Verifique se cada tributo é recuperável e qual regime tributário se aplica. Em regra, tributos recuperáveis geram direito a crédito e não integram o custo do estoque; tributos não recuperáveis integram o custo quando diretamente atribuíveis à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 28, "source": "FCC - Ag FRT (ARTESP)/ARTESP/Técnico em Contabilidade - Administração/2017", "statement": "A empresa Coruja S.A., ao adquirir mercadorias para o carnaval de 2017, incorreu nos seguintes gastos:\n\n \n\nMercadorias:                 R$ 120.000,00 (valor líquido de tributos)\n\nFrete sobre compras:    R$ 3.000,00 (valor líquido de tributos)\n\nSeguro:                          R$ 2.000,00 (transporte das mercadorias até a empresa)\n\nICMS:                             R$ 20.000,00\n\nIPI:                                  R$ 10.000,00\n\n \n\nSabe-se que a empresa é contribuinte do ICMS, mas não é contribuinte do IPI. Com base nestas informações, o valor reconhecido como Estoques foi, em reais,", "options": {"A": "135.000,00.", "B": "123.000,00.", "C": "125.000,00.", "D": "145.000,00.", "E": "155.000,00."}, "answer": "A", "explanation": "Gabarito fornecido: A.\n\nAlternativa indicada: 135.000,00.\n\nFundamentação: Verifique se cada tributo é recuperável e qual regime tributário se aplica. Em regra, tributos recuperáveis geram direito a crédito e não integram o custo do estoque; tributos não recuperáveis integram o custo quando diretamente atribuíveis à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 29, "source": "FCC - AJ TST/TST/Apoio Especializado/Contabilidade/2017", "statement": "Uma empresa adquiriu à vista, em 30/11/2016, mercadorias pelo valor total de R$ 10.000.000,00, sendo que neste valor estavam incluídos os seguintes impostos:\n\n\n− R$ 1.000.000,00 de impostos não recuperáveis.\n− R$ 1.200.000,00 de impostos que são compensados com os impostos incidentes no momento da venda das mercadorias.\n\n\nNo mês de dezembro de 2016 a empresa vendeu 80% das mercadorias que foram adquiridas em 30/11/2016 pelo valor bruto de R$ 9.400.000,00, sendo que os impostos incidentes sobre estas vendas totalizaram R$ 940.000,00. O valor das despesas com frete para a entrega das vendas efetuadas foi R$ 60.000,00. Sabendo-se que não havia saldo de estoque de mercadorias antes da compra de 30/11/2016, o Resultado Bruto com Mercadorias apurado pela empresa no ano de 2016, exclusivamente relacionado com as vendas aqui apresentadas, foi, em reais,", "options": {"A": "1.360.000,00.", "B": "2.220.000,00.", "C": "1.420.000,00.", "D": "2.360.000,00.", "E": "3.160.000,00."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 1.420.000,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 30, "source": "FCC - AFRE (SEFAZ MA)/SEFAZ MA/Administração Tributária/2016", "statement": "Uma empresa importou um lote de mercadorias para comercialização no Brasil, sendo que a compra foi realizada em outubro de 2013 e o preço pago à vista ao fornecedor no exterior foi R$ 3.000.000,00. Os gastos descritos a seguir foram necessários para a empresa dispor das mercadorias em condições de venda, e foram todos pagos à vista:\n \n\n− Gasto de R$ 300.000,00 para transportar as mercadorias do país de origem até o Brasil.\n \n\n− Taxas e tarifas no valor de R$ 120.000,00 para o ingresso e regularização das mercadorias no Brasil.\n \n\n− Imposto de importação no valor de R$ 30.000,00. Este imposto é definitivo e não é compensável pela empresa.\n \n\n− Gasto de R$ 50.000,00 para transporte das mercadorias até o depósito da empresa.\n \n\n− Impostos locais no valor de R$ 45.000,00 que podem ser compensados com os impostos incidentes no momento da venda das mercadorias.\n \n\nSabe-se que não havia saldo de estoque antes desta compra e que, em dezembro de 2013, a empresa vendeu oitenta por cento (80%) das mercadorias que haviam sido importadas. O valor evidenciado pela empresa no Balanço Patrimonial de 31/12/2013, exclusivamente em relação às mercadorias importadas remanescentes, foi, em reais:", "options": {"A": "600.000,00.", "B": "709.000,00.", "C": "700.000,00.", "D": "630.000,00.", "E": "606.000,00"}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 700.000,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}], [{"number": 31, "source": "FCC - TRE (SEFAZ MA)/SEFAZ MA/Arrecadação e Fiscalização de Mercadorias em Trânsito/2016", "statement": "Em 01/03/2016, a empresa comercial New Orleans S.A. adquiriu mercadorias para revenda no valor de R$ 220.000,00, no qual estavam inclusos tributos recuperáveis de R$ 36.000,00 e tributos não recuperáveis de R$ 20.000,00. Com base nessas informações, em 01/03/2016, a contabilidade da empresa New Orleans S.A. realizou um lançamento de", "options": {"A": "crédito na conta patrimonial Fornecedores no valor de R$ 184.000,00.", "B": "débito na conta de resultados Tributos sobre Vendas no valor de R$ 20.000,00.", "C": "crédito na conta patrimonial Tributos a Recuperar no valor de R$ 36.000,00.", "D": "débito na conta patrimonial Estoques no valor de R$ 184.000,00.", "E": "crédito na conta patrimonial Tributos a Recolher no valor de R$ 20.000,00."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: débito na conta patrimonial Estoques no valor de R$ 184.000,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 32, "source": "FCC - TRE (SEFAZ MA)/SEFAZ MA/Tecnologia da Informação/2016", "statement": "A Cia. Rex adquiriu mercadorias para serem comercializadas e desembolsou os seguintes valores:\n\n \n\nMercadorias: R$ 660.000,00, valor líquido dos tributos\n\n \n\nFrete para transporte até a empresa: R$ 10.000,00, valor líquido dos tributos\n\n \n\nSeguro das mercadorias: R$ 5.000,00\n\n \n\nTributos recuperáveis: R$ 65.000,00\n\n \n\nTributos não recuperáveis: R$ 40.000,00\n\n \n\nCom base nestas informações, o valor das mercadorias adquiridas reconhecido como Estoque da Cia. Rex foi, em reais, de", "options": {"A": "660.000,00.", "B": "715.000,00.", "C": "780.000,00.", "D": "675.000,00.", "E": "740.000,00."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 715.000,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 33, "source": "FCC - ALegis (ALMS)/ALMS/Contador/2016", "statement": "A Cia. Pedras Belas, ao adquirir mercadorias para revenda, pagou os seguintes valores:\n \n\nMercadorias ............................................................................................................................... R$ 80.000,00 (líquido de tributos)\nFrete para transporte das mercadorias até a empresa ..............................................................       R$  5.000,00 (líquido de tributos)\nSeguro para transporte das mercadorias até a empresa ...........................................................        R$  3.000,00\nTributos recuperáveis ................................................................................................................    R$ 15.000,00\nTributos não recuperáveis .........................................................................................................     R$ 10.000,00\n \n\nCom base nessas informações, o valor dos estoques da Cia. Pedras Belas foi aumentado, em reais,", "options": {"A": "80.000,00.", "B": "98.000,00.", "C": "88.000,00.", "D": "85.000,00.", "E": "113.000,00."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 98.000,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 34, "source": "FCC - Ass Tec (Pref Teresina)/Pref Teresina/Administrativo/Técnico Contábil/2016", "statement": "Considere as seguintes operações realizadas pela Cia. Flores:\n\n \n\nI. Aquisição de marcas e patentes para garantir a produção de equipamentos especiais.\n\n \n\nII. Aquisição de equipamentos para revenda.\n\n \n\nIII. Aquisição de máquinas para a utilização no processo produtivo.\n\n \n\nOs ativos adquiridos nas operações I, II e III foram reconhecidos pela Cia. Flores, respectivamente, como", "options": {"A": "imobilizado, intangível e investimentos.", "B": "intangível, imobilizado e imobilizado.", "C": "imobilizado, estoques e imobilizado.", "D": "intangível, estoques e imobilizado.", "E": "intangível, imobilizado e investimentos."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: intangível, estoques e imobilizado.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 35, "source": "FCC - Ana GFC (CREMESP)/CREMESP/Contábil/2016", "statement": "A Cia. Forte adquiriu em 01/10/2016 produtos para serem revendidos. Os produtos foram adquiridos à vista por R$ 200.000,00, sendo que neste valor estavam inclusos os tributos recuperáveis de R$ 25.000,00 e os tributos não recuperáveis de R$ 15.000,00. Adicionalmente, a Cia. Forte contratou e pagou frete e seguro, para transporte dos produtos adquiridos até a empresa, no valor total de R$ 5.000,00, sendo que neste valor estavam inclusos tributos recuperáveis de R$ 500,00. Em 20/10/2016, a Cia. Forte revendeu 80% destes produtos por R$ 400.000,00, à vista. Com base nestas informações, o custo das mercadorias vendidas reconhecido pela Cia. Forte decorrente desta venda foi, em reais,", "options": {"A": "128.000,00.", "B": "148.000,00.", "C": "164.000,00.", "D": "151.600,00.", "E": "143.600,00."}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: 143.600,00.\n\nFundamentação: CMV = estoque inicial + compras líquidas − estoque final. Em lote único, pode-se calcular custo de aquisição × percentual vendido. Custo de aquisição inclui frete e seguro de entrada e tributos não recuperáveis, excluindo tributos recuperáveis e descontos comerciais obtidos.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 36, "source": "FCC - AJ TRE AP/TRE AP/Apoio Especializado/Contabilidade/2015", "statement": "Uma empresa comercializa uma mercadoria importada e fez a aquisição de um único lote pagando ao fornecedor no exterior o valor correspondente a R$ 2.000.000,00. A empresa assumiu também os seguintes gastos para dispor da mercadoria em condições de venda e pagou:\n\n\n− R$ 200.000,00 de frete marítimo para trazer a mercadoria até um porto no Brasil.\n− R$ 80.000,00 de taxas e tarifas alfandegárias para ingresso da mercadoria no país.\n− R$ 20.000,00 de imposto de importação não recuperável.\n− R$ 50.000,00 para transporte da mercadoria do porto até a sede da empresa.\n− R$ 30.000,00 de impostos nacionais que serão compensáveis (recuperáveis) com os impostos que incidem no momento da venda.\n\n\nSabe-se que a empresa não tinha saldo de estoque antes desta compra e que vendeu oitenta por cento (80%) do lote adquirido pelo valor líquido de tributos de R$ 2.500.000,00. O Lucro Bruto apurado pela empresa, exclusivamente em relação à parcela do lote vendido, foi, em reais:", "options": {"A": "900.000,00.", "B": "596.000,00.", "C": "620.000,00.", "D": "636.000,00.", "E": "796.000,00."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 620.000,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 37, "source": "FCC - Téc Cont (DPE RR)/DPE RR/2015", "statement": "Atenção: Para responder à questão, considere as informações abaixo.\n\n\nUma empresa adquiriu, durante o ano de 2013, mercadorias para revenda pelo valor total de R$ 4.000.000,00, sendo que está incluído neste total o valor de R$ 600.000,00 de impostos que serão compensáveis com os impostos incidentes sobre o valor das vendas efetuadas pela empresa. As mercadorias foram retiradas no depósito do fornecedor e a empresa compradora pagou o frete no valor total de R$ 100.000,00. Sabe-se que a empresa não tinha estoque no início de 2013 e que vendeu 90% do total das mercadorias adquiridas neste ano pelo valor total de R$ 6.000.000,00. No valor total das vendas está incluído o valor de R$ 900.000,00 de impostos incidentes sobre vendas.\n\n\nO valor do saldo de estoque remanescente evidenciado no Balanço Patrimonial de 31/12/2013 foi, em reais,", "options": {"A": "400.000,00.", "B": "410.000,00.", "C": "350.000,00.", "D": "340.000,00.", "E": "330.000,00."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 350.000,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 38, "source": "FCC - AgDP (DPE SP)/DPE SP/Contador/2015", "statement": "Um lote de mercadorias foi adquirido de um fornecedor no exterior pelo valor correspondente a R$ 1.000.000,00. Adicionalmente a empresa pagou os seguintes valores para ter as mercadorias em condições de venda:\n\n\n− R$ 125.000,00 de frete, incluindo o transporte marítimo para trazer a mercadoria do País de origem e também o transporte local até a empresa.\n\n\n− R$ 40.000,00 de taxas e tarifas alfandegárias para ingresso das mercadorias no País.\n\n\n− R$ 25.000,00 de impostos, sendo que deste total o valor de R$ 15.000,00 corresponde a impostos compensáveis pela empresa na ocasião da venda da mercadoria.\n\n\nA empresa não tinha saldo de estoque antes desta compra e vendeu oitenta por cento (80%) do lote adquirido. O valor contabilizado como Custo das Mercadorias Vendidas no momento da venda, exclusivamente em relação à parcela deste lote vendida foi, em reais,", "options": {"A": "800.000,00.", "B": "952.000,00.", "C": "940.000,00.", "D": "932.000,00.", "E": "852.000,00."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 940.000,00.\n\nFundamentação: CMV = estoque inicial + compras líquidas − estoque final. Em lote único, pode-se calcular custo de aquisição × percentual vendido. Custo de aquisição inclui frete e seguro de entrada e tributos não recuperáveis, excluindo tributos recuperáveis e descontos comerciais obtidos.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 39, "source": "FCC - AFRE GO/SEFAZ GO/2026", "statement": "No dia 23/10/2023, a empresa Comprando e Vendendo S.A. adquiriu mercadorias para revenda e pagou os seguintes valores:\n\n    R$ 1.010.250 para o fornecedor das mercadorias.\n    R$ 30.000 para a transportadora que levou as mercadorias até sua loja.\n\nEstão incluídos nesses valores pagos, os seguintes tributos:\n\n    Tributos recuperáveis no valor total de R$ 138.000\n    Tributos não recuperáveis no valor total de R$ 96.000\n\nEm 10/12/2023, a empresa vendeu 80% das mercadorias pelo valor R$ 2.700.000, mas concedeu um desconto comercial de 10% em função da quantidade adquirida pelo comprador. Os impostos sobre a venda são de 10% sobre o valor líquido da venda, a empresa pagou para seus vendedores o valor de R$ 48.600 a título de comissão e R$ 42.000 para a transportadora que fez a entrega das mercadorias vendidas. O lucro bruto apurado pela empresa Comprando e Vendendo S.A., especificamente em relação à compra e venda das mercadorias citadas, foi, em reais,", "options": {"A": "1.374.600", "B": "1.708.200", "C": "1.542.000", "D": "1.416.600", "E": "1.465.200"}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: 1.465.200\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 40, "source": "FCC - Ana Leg (ALERR)/ALERR/Contador/2026", "statement": "No dia 01/11/2024, a empresa Entrega Garantida S.A. não possuía estoque e adquiriu mercadorias para revenda nas seguintes condições:\n\n    Compras à vista ................................................................................................................................. R$ 2.000.000,00\n    Compras a prazo ................................................................................................................................ R$ 4.153.600,00\n    A empresa pagou, adicionalmente, o valor de R$ 80.000,00 para o transporte das mercadorias até seu depósito.\n\nAs compras realizadas a prazo serão pagas integralmente no longo prazo e a taxa de juros implícita na compra era 1,389% ao mês, que é equivalente a 18% no prazo de pagamento contratado.\n \n\nNos valores correspondentes às compras, já estão incluídos R$ 600.000,00 de impostos recuperáveis e R$ 500.000,00 de impostos não recuperáveis.\n \n\nSabendo que, nos meses de novembro e dezembro de 2024, a empresa vendeu 80% do estoque que havia adquirido em 01/11/2024, os saldos contábeis evidenciados no Balanço Patrimonial de 31/12/2024 na conta Estoques, no ativo circulante, e na conta Fornecedores, no passivo não circulante, foram, respectivamente e em reais:", "options": {"A": "1.126.720,00 e 3.520.000,00.", "B": "1.000.000,00 e 3.520.000,00.", "C": "1.126.720,00 e 4.153.600,00.", "D": "1.000.000,00 e 3.618.464,72.", "E": "1.126.720,00 e 3.618.464,72."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 1.000.000,00 e 3.618.464,72.\n\nFundamentação: Quando houver componente financeiro significativo, a compra ou venda é reconhecida inicialmente pelo equivalente à vista. A diferença entre o valor a prazo e o valor à vista é apropriada como receita ou despesa financeira ao longo do prazo. Fretes de entrada e tributos recuperáveis seguem as regras do CPC 16.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}], [{"number": 41, "source": "FCC - Ana Leg (ALERR)/ALERR/Contador/2026", "statement": "No dia 01/12/2024 uma empresa realizou vendas de mercadorias nas seguintes condições:\n\n    Vendas à vista ................................................................................................................................... R$ 4.000.000,00\n    Vendas a prazo .................................................................................................................................. R$ 3.047.500,00\n\nAs vendas a prazo serão recebidas integralmente em 01/06/2026, sendo que a empresa praticava a taxa de juros de 0,758% ao mês (equivalente a 15% no prazo da venda a prazo).\n \n\nSabendo que os impostos incidentes sobre a Receita de Vendas totalizaram R$ 800.000,00 e as despesas com frete para a entrega das mercadorias vendidas totalizaram R$ 25.000,00, o valor da Receita Líquida de Vendas a ser evidenciado na Demonstração do Resultado do ano de 2024, decorrentes exclusivamente das vendas efetuadas em 01/12/2024, foi, em reais:", "options": {"A": "5.825.000,00.", "B": "7.047.500,00.", "C": "6.247.500,00.", "D": "6.650.000,00.", "E": "5.850.000,00."}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: 5.850.000,00.\n\nFundamentação: Quando houver componente financeiro significativo, a compra ou venda é reconhecida inicialmente pelo equivalente à vista. A diferença entre o valor a prazo e o valor à vista é apropriada como receita ou despesa financeira ao longo do prazo. Fretes de entrada e tributos recuperáveis seguem as regras do CPC 16.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 42, "source": "FCC - AFFE (SEFAZ CE)/SEFAZ CE/Tecnologia da Informação/2026", "statement": "Uma empresa atua no ramo de compra e venda de mercadorias. A empresa adquiriu um lote de mercadorias para revenda no dia 01/12/2024 e pagou os seguintes valores para dispor do estoque:\n \n\n    R$ 4.041.000 para o fornecedor das mercadorias.\n    R$ 120.000 para a transportadora que levou as mercadorias até sua loja.\n\n \n\nEstão incluídos nesses valores pagos os seguintes tributos:\n \n\n    Tributos recuperáveis no valor total de R$ 552.000.\n    Tributos não recuperáveis no valor total de R$ 384.000.\n\n \n\nEm 20/12/2024, a empresa vendeu 80% das mercadorias pelo valor de R$ 9.720.000, sendo que os impostos sobre a venda correspondem a 10% sobre o valor da venda e a empresa pagou R$ 168.000 para uma transportadora fazer a entrega das mercadorias vendidas para os clientes.\n \n\nConsiderando apenas a compra e venda das mercadorias citadas, o lucro bruto apurado pela empresa foi, em reais,", "options": {"A": "7.140.000", "B": "6.168.000", "C": "6.832.000", "D": "5.860.800", "E": "6.000.000"}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 5.860.800\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 43, "source": "FCC - Cont (ABGF)/ABGF/2026", "statement": "A empresa “Guarda-tudo Ltda” apresentava em 30/11/20X5 os seguintes saldos:\n \nConta \tSaldo em 30/11/20X5 (em R$)\nEstoque de mercadorias \t50.000,00\nAdiantamento de Clientes \t6.000,00\nContas a Receber de Clientes \t8.000,00\nReceita de Vendas \t56.000,00\n \n\nEm dezembro de 20X5, a empresa realizou as seguintes operações:\n \n\n1. Compra a prazo de mercadorias para revenda, no valor de R$ 7.000,00;\n \n\n2. Venda das mercadorias no valor total de R$ 15.000,00, sendo metade a vista e a outra metade a prazo;\n \n\n3. Entrega de mercadorias referentes ao recebimento antecipado de vendas, no valor de venda de R$ 5.000,00.\n \n\nO inventário final, de 31/12/20X5, das mercadorias era de R$ 5.000,00, sendo que a empresa adota o método do inventário periódico.\n \n\nDesconsidere os impactos fiscais e, com base apenas nessas informações, o Lucro Bruto apresentado na Demonstração do Resultado da “Guarda-tudo Ltda.” foi de", "options": {"A": "R$ 76.000,00", "B": "R$ 24.000,00", "C": "R$ 19.000,00", "D": "R$ 71.000,00", "E": "R$ 18.000,00"}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: R$ 24.000,00\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alt
