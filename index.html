ernativas."}, {"number": 44, "source": "FCC - TJ TRF4/TRF 4/Apoio Especializado/Contabilidade/2025", "statement": "A empresa Comércio de Produtos Importados S.A. efetuou, em 15/09/2023, a compra de um lote de mercadorias de um fornecedor no exterior. O valor pago ao fornecedor foi R$ 18.000.000 e a empresa incorreu, adicionalmente, nos seguintes gastos com os valores expressos em reais:\n \n\n     Transporte marítimo para o Brasil.................................................... 1.800.000\n     Impostos, taxas e tarifas para a importação ...................................     900.000\n     Impostos locais recuperáveis na venda ..........................................     270.000\n     Transporte da mercadoria até a sede da empresa .........................     300.000\n\n \n\nA empresa Comércio de Produtos Importados S.A. vendeu, em dezembro de 2023, 90% do estoque que havia comprado em 15/09/2023. O valor bruto da venda foi R$ 25.500.000 e o valor dos impostos incidentes sobre a receita de venda foi R$ 3.825.000.\n \n\nO Resultado Bruto com Mercadorias apurado exclusivamente em relação às mercadorias importadas e vendidas foi, em reais:", "options": {"A": "3.045.000.", "B": "2.775.000.", "C": "5.475.000.", "D": "2.532.000.", "E": "4.665.000."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 2.775.000.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 45, "source": "FCC - AFFE (SEFAZ PI)/SEFAZ PI/Geral/2025", "statement": "Para responder à questão abaixo, utilize as informações a seguir:\n \n\nAs informações a seguir referem-se à compra de mercadorias pela empresa Produtos Essenciais S.A., sendo que os valores estão expressos em reais:\n \n\n- Data da compra: 20/10/2023\n\n- Valor pago à empresa vendedora das mercadorias: R$ 1.155.000,00\n\n- Valor pago pelo transporte das mercadorias do depósito da empresa vendedora até seu depósito: R$ 50.000,00\n\n- Valor pago à seguradora para garantir que as mercadorias chegassem em ordem ao seu depósito: R$ 30.000,00\n \n\nCom relação aos impostos incluídos nos valores pagos pela empresa são conhecidas as seguintes informações: \n \n\n- Tributos recuperáveis incluídos no valor de: R$ 110.000,00\n\n- Tributos não recuperáveis incluídos no valor de: R$ 48.000,00\n \n\nNo dia 1/12/2023, a empresa efetuou uma venda nas seguintes condições: \n \n\n- Quantidade vendida: 80% do total que havia sido comprado em 20/10/2023\n\n- Valor total da venda: R$ 1.500.000,00, sendo 60% à vista e 40% a prazo\n\n- Prazo para pagamento da venda a prazo: 18 meses em uma única parcela no final do prazo\n\n- Comissão paga para seus vendedores: R$ 13.500,00\n\n- Valor pago para a transportadora que fez a entrega das mercadorias vendidas: R$ 21.000,00\n \n\nA taxa de juros praticada pela empresa para suas vendas a prazo era 1,02% ao mês, equivalente a 20% para o prazo de 18 meses.\n \n\nO Custo das Mercadorias Vendidas evidenciado na Demonstração do Resultado do ano de 2023 da empresa Produtos Essenciais S.A., especificamente em relação à compra e venda das mercadorias citadas, foi:", "options": {"A": "R$ 836.000,00", "B": "R$ 900.000,00", "C": "R$ 876.000,00", "D": "R$ 988.000,00", "E": "R$ 868.000,00"}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: R$ 900.000,00\n\nFundamentação: Quando houver componente financeiro significativo, a compra ou venda é reconhecida inicialmente pelo equivalente à vista. A diferença entre o valor a prazo e o valor à vista é apropriada como receita ou despesa financeira ao longo do prazo. Fretes de entrada e tributos recuperáveis seguem as regras do CPC 16.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 46, "source": "FCC - Ana Min (MPE PI)/MPE PI/Contabilidade/2025", "statement": "Um lote de mercadorias para revenda foi adquirido pela empresa Revendedora Nacional S.A. que pagou os seguintes valores:\n \n\n▪ Valor pago ao fornecedor das mercadorias ................................................................. R$ 440.000\n \n\n▪ Valor pago a uma transportadora para levar as mercadorias do depósito do fornecedor até o depósito da empresa ........................................................................................................... R$ 24.000\n \n\n▪ Valor pago por um seguro para transportar os produtos até o depósito da empresa ..... R$ 8.000\n   \n\nApós uma análise, a empresa devolveu 20% das mercadorias ao fornecedor por não atenderem às especificações técnicas estabelecidas e conseguiu, adicionalmente, um abatimento de R$ 20.000 sobre o valor remanescente após a devolução. Não houve nenhuma redução nos valores pagos à transportadora e à seguradora.\n \n\nNo valor total do estoque remanescente estavam incluídos os seguintes tributos:\n \n\n▪ Tributos recuperáveis ........................................................................................................ R$ 64.000\n\n▪ Tributos não recuperáveis ................................................................................................. R$ 36.000\n \n\nA empresa Revendedora Nacional S.A. vendeu 90% do estoque remanescente pelo valor de R$ 800.000, tendo recebido à vista. Sobre o valor da venda houve a incidência de impostos no valor de R$ 70.000 e a empresa pagou R$ 24.000 de comissão para seus vendedores. O valor do lucro bruto apurado pela empresa, relacionado apenas com estas transações de compra e venda foi, em reais,", "options": {"A": "434.800.", "B": "472.400.", "C": "402.400.", "D": "436.000.", "E": "460.000."}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: 460.000.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 47, "source": "FCC - AJ TRT11/TRT 11/Administrativa/Contabilidade/2024", "statement": "A indústria ÔMEGA Ltda. produziu, em março de 20X3, 2.000 unidades de seu produto, sendo que 1.500 unidades foram vendidas no período pelo preço final de venda de R$ 134,40 cada unidade. O custo variável unitário da mercadoria vendida foi de R$ 30,00 por unidade, mas a empresa incorreu ainda em R$ 64.000,00 de custos fixos indiretos de fabricação, distribuídos igualmente entre as unidades produzidas. Nesta transação de venda, houve a incidência de Imposto sobre a Circulação de Mercadorias e Prestação de Serviços (ICMS) à alíquota de 18% e incidência de Imposto sobre Produtos Industrializados (IPI) à alíquota de 12%. A entidade incorreu ainda em despesas de vendas de R$ 20.000,00 e outras despesas administrativas de R$ 15.000,00. Com base nas informações apresentadas e considerando que a entidade utiliza o método de custeio permitido pelo CPC16(R1) - Estoques, que não foram registradas outras receitas no período e que não havia estoque remanescente do mês anterior, o Resultado Antes dos Tributos sobre o Lucro da empresa ÔMEGA Ltda. no mês de março de 20X3 foi, em reais,", "options": {"A": "3.600,00.", "B": "28.350,00.", "C": "13.120,00.", "D": "19.600,00.", "E": "37.800,00."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 19.600,00.\n\nFundamentação: Verifique se cada tributo é recuperável e qual regime tributário se aplica. Em regra, tributos recuperáveis geram direito a crédito e não integram o custo do estoque; tributos não recuperáveis integram o custo quando diretamente atribuíveis à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 48, "source": "FCC - AJ TRT20/TRT 20/Administrativa/Contabilidade/2024", "statement": "Em 01/09/2023 a empresa Vendemos-de-Tudo S.A. não possuía estoque de mercadorias para revenda. Em 15/09/2023 efetuou a compra de um lote de mercadorias de um fornecedor no exterior, pelo valor de R$ 6.000.000, que foram pagos à vista. A empresa incorreu, adicionalmente, nos seguintes encargos para dispor das mercadorias em condições de venda:\n \n\n- R$ 600.000 de transporte aéreo internacional para trazer a mercadoria até o Brasil.\n\n- R$ 300.000 de taxas e tarifas alfandegárias para ingresso das mercadorias no Brasil, incluindo o imposto de importação.\n\n- R$ 90.000 de impostos locais que são compensados com os impostos incidentes quando ocorrer a venda das mercadorias.\n\n- R$ 100.000 para transportar a mercadoria do aeroporto até a sede da empresa.\n \n\nEm novembro de 2023, a empresa Vendemos- de -Tudo S.A. vendeu noventa por cento (90%) do estoque pelo valor bruto de R$ 8.500.000 e os impostos incidentes na venda totalizaram R$ 1.275.000. O Resultado Bruto com Mercadorias apurado exclusivamente em relação às mercadorias importadas e vendidas foi, em reais:", "options": {"A": "1.015.000.", "B": "3.100.000.", "C": "925.000.", "D": "844.000.", "E": "1.555.000."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 925.000.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 49, "source": "FCC - Ana (COPERGÁS)/COPERGÁS/Contador/2023", "statement": "O departamento comercial de uma companhia de gás solicita ao contador da empresa que o auxilie na determinação da tarifa do metro cúbico (m3) de gás natural para uso veicular.\n \n\nConsidere os dados fictícios, vigentes no Estado em que está localizada a empresa de gás, de que, sobre as tarifas de fornecimento para o segmento de uso veicular, incidem 12% de ICMS e 0% de PIS/COFINS.\n \n\nConsiderando apenas o ICMS e as contribuições de PIS/COFINS e sabendo que a tarifa, sem tributos, para Novembro de 2022, era de R$ 2,5556 por metro cúbico (m3); o valor da tarifa (com tributos) do metro cúbico (m3) de gás natural para uso veicular para Novembro de 2022, foi, em reais, de", "options": {"A": "2,5556.", "B": "2,8622.", "C": "2,9041.", "D": "3,0156.", "E": "2,2818."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 2,9041.\n\nFundamentação: Verifique se cada tributo é recuperável e qual regime tributário se aplica. Em regra, tributos recuperáveis geram direito a crédito e não integram o custo do estoque; tributos não recuperáveis integram o custo quando diretamente atribuíveis à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 50, "source": "FCC - Ana (COPERGÁS)/COPERGÁS/Contador/2023", "statement": "Uma indústria pernambucana do segmento de fabricação de produtos plásticos não relacionados com embalagens para bebidas, água, refrigerante ou cerveja, que se encontra enquadrada no regime não-cumulativo de PIS e COFINS, adquiriu, no mês de setembro de 2022, determinados insumos industriais, que são essenciais para seu processo produtivo.\n \n\nA aquisição destes insumos foi acompanhada de Nota Fiscal no valor total de R$ 100.000,00, sendo que o ICMS, calculado com base na alíquota de 18%, foi destacado pelo fornecedor, e houve a incidência das contribuições PIS-COFINS, pelo regime cumulativo.\n \n\nEm relação a essa aquisição, os montantes de créditos fiscais das contribuições PIS-COFINS e de ICMS são, em reais, respectivamente,", "options": {"A": "9.250,00 e 21.240,00.", "B": "3.650,00 e 14.760,00.", "C": "3.650,00 e 18.000,00.", "D": "9.250,00 e 18.000,00.", "E": "9.250,00 e 14.760,00."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 9.250,00 e 18.000,00.\n\nFundamentação: Verifique se cada tributo é recuperável e qual regime tributário se aplica. Em regra, tributos recuperáveis geram direito a crédito e não integram o custo do estoque; tributos não recuperáveis integram o custo quando diretamente atribuíveis à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}], [{"number": 51, "source": "FCC - AJ TRT17/TRT 17/Administrativa/Contabilidade/2022", "statement": "Os seguintes valores foram pagos pela empresa Intermediação de Mercadorias S.A. para a aquisição de produtos para comercialização:\n \n\nPagamento ao fornecedor dos produtos: ........................................................ R$ 690.000,00\n\nPagamento de seguro para o transporte dos produtos até a empresa: ........... R$ 18.000,00\n \n\nEstavam inclusos nos valores pagos os seguintes tributos:\n \n\nTributos recuperáveis: ..................................................................................... R$ 96.000,00\n\nTributos não recuperáveis: .............................................................................. R$ 54.000,00\n \n\nTodos os produtos adquiridos pela empresa Intermediação de Mercadorias S.A. foram revendidos pelo valor total de R$ 1.500.000,00, tendo sido concedido um desconto de 10% no momento da venda porque o valor foi recebido à vista. O valor dos impostos incidentes sobre o valor das vendas foi R$ 159.000,00 e a empresa pagou comissão para os vendedores no valor de R$ 36.000,00. Com base nestas informações, o valor do Lucro Bruto apurado pela Intermediação de Mercadorias S.A., relacionado especificamente com a venda mencionada foi, em R$,", "options": {"A": "738.000,00", "B": "483.000,00", "C": "579.000,00", "D": "543.000,00", "E": "537.000,00"}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 579.000,00\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 52, "source": "FCC - Ana Adm (SANASA)/SANASA/Contabilidade/2019", "statement": "As empresas, ao serem tributadas com relação ao Programa de Integração Social (PIS) e à Contribuição para Financiamento da Seguridade Social (COFINS), encontrarão dois tipos de regimes, sendo eles: o regime cumulativo e o regime não cumulativo.\n\n \n\nEm relação aos dois regimes, considere:\n\n \n\nI. No regime não cumulativo aplica-se as alíquotas de 1,65% para PIS e 7,6% para Cofins.\n\n \n\nII. Na apropriação de créditos a empresa poderá aplicar o regime cumulativo.\n\n \n\nIII. Para as empresas optantes pelo Lucro Presumido, as quais são sujeitas ao regime cumulativo, as alíquotas do PIS e Cofins, são 0,65% e 3%, respectivamente.\n\n \n\nEstá correto o que consta APENAS de", "options": {"A": "II.", "B": "I e II.", "C": "I e III.", "D": "III.", "E": "II e III."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: I e III.\n\nFundamentação: Verifique se cada tributo é recuperável e qual regime tributário se aplica. Em regra, tributos recuperáveis geram direito a crédito e não integram o custo do estoque; tributos não recuperáveis integram o custo quando diretamente atribuíveis à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 53, "source": "FCC - Ana Adm (SANASA)/SANASA/Contabilidade/2019", "statement": "A indústria ZIP realizou diversas compras em dezembro/2018:\n \n\n− R$ 10.000,00 de matéria-prima, adquirida em 01/12/2018 originário de estabelecimento industrial, com a alíquota de IPI 20%.\n \n\n− R$ 5.000,00 de produtos intermediários que serão utilizados no processo de fabricação, adquiridos de estabelecimento industrial em 05/12/2018, com alíquota de IPI de 15%.\n \n\n− R$ 3.000,00 de material para embalagem, oriundos de estabelecimento atacadista, sem débito de IPI. Sabendo que se adquirido de estabelecimento industrial a alíquota de IPI é de 10%.\n \n\nEm 23/12/2018, a empresa realizou a seguinte operação: vendas de produtos de industrialização própria no valor de R$ 40.000,00, tendo um desconto comercial de 3% e frete FOB no valor de R$ 2.000,00, com a alíquota de IPI de 10%.\n \n\nSabendo que a empresa apropriou-se de todos os créditos referentes ao IPI, o valor do IPI a pagar é, em R$,", "options": {"A": "980,00.", "B": "1.200,00.", "C": "2.900,00.", "D": "1.300,00.", "E": "1.180,00."}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: 1.180,00.\n\nFundamentação: Verifique se cada tributo é recuperável e qual regime tributário se aplica. Em regra, tributos recuperáveis geram direito a crédito e não integram o custo do estoque; tributos não recuperáveis integram o custo quando diretamente atribuíveis à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 54, "source": "FCC - Ana Leg (ALESE)/ALESE/Apoio Técnico Administrativo/Contabilidade/2018", "statement": "A Cia. de Comércio Violeta, ao adquirir mercadorias para revenda, pagou os seguintes valores em reais:\n \nValor das Mercadorias (sem impostos) .............................................................................. 200.000,00\nSeguro para Transporte até a empresa .................................................................................. 3.000,00\nFrete para Transporte até a empresa ................................................................................... 10.000,00\nTributos Recuperáveis .......................................................................................................... 25.000,00\nTributos não Recuperáveis ................................................................................................... 14.000,00\n \n\nSabendo que a Cia. revendeu todas estas mercadorias por R$ 440.000,00, mas concedeu um desconto de 10% no momento da venda, o custo das mercadorias vendidas e o lucro bruto apurados pela Cia. de Comércio Violeta foram, respectivamente, em reais,", "options": {"A": "213.000,00  e  183.000,00.", "B": "227.000,00  e  144.000,00.", "C": "227.000,00  e  169.000,00.", "D": "238.000,00  e  144.000,00.", "E": "238.000,00  e  158.000,00."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 227.000,00  e  169.000,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 55, "source": "FCC - Ana (SABESP)/SABESP/Gestão/Contabilidade/2018", "statement": "A empresa Compra e Vende Comércio S.A. adquiriu mercadorias para revenda e incorreu nos seguintes gastos durante o ano de 2017:\n \n\n−  Pagamento ao fornecedor das mercadorias: R$ 862.500,00.\n\n\n−  Valor do frete para transporte das mercadorias até a empresa: R$ 40.500,00 que foram pagos após 30 dias da data da compra.\n\n\n−  Pagamento de seguro para transporte das mercadorias até a empresa: R$ 60.000,00.\n \n\nNos diversos valores pagos ou a pagar para dispor das mercadorias estavam incluídos tributos recuperáveis que totalizavam R$ 67.500,00 e tributos não recuperáveis que totalizavam R$ 48.000,00.\n \n\nA empresa obteve durante o ano abatimentos sobre as compras efetuadas no valor de R$ 90.000,00. Sabe-se que o estoque inicial de mercadorias era R$ 300.000,00 e que no final do período o saldo apresentado era R$ 225.000,00.\n \n\nO preço de venda das mercadorias vendidas foi R$ 1.305.000,00, e a empresa concedeu um desconto de 5% ao comprador em função do volume negociado. Os tributos incidentes sobre as vendas realizadas totalizaram o valor de R$ 129.750,00.\n \n\nAdicionalmente, a empresa incorreu nos seguintes gastos relacionados com a venda efetuada:\n \n\n−  Pagamento de frete no valor de R$ 12.000,00 para a entrega das mercadorias vendidas.\n\n\n−  Pagamento de comissão para os vendedores no valor de R$ 18.000,00.\n\n\n−  Despesas gerais no valor de R$ 60.000,00.\n \n\nConsiderando as informações apresentadas anteriormente, o Custo das Mercadorias Vendidas (CMV) e o valor do Resultado Bruto com Vendas (Lucro bruto) são, respectivamente, em reais,", "options": {"A": "780.000,00 e 330.000,00.", "B": "880.500,00 e 199.500,00.", "C": "780.000,00 e 300.000,00.", "D": "880.500,00 e 424.500,00.", "E": "880.500,00 e 229.500,00."}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: 880.500,00 e 229.500,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 56, "source": "FCC - AJ TRT11/TRT 11/Administrativa/Contabilidade/2017", "statement": "A empresa Eucalipto S.A. adquiriu mercadorias para revenda e pagou os seguintes valores:\n\n\nLote de Madeira: R$ 300.000,00, valor líquido de tributos\nFrete (para transporte da madeira até a empresa Eucalipto S.A.): R$ 30.000,00, valor líquido de tributos\nSeguro (para transporte da madeira até a empresa Eucalipto S.A.): R$ 20.000,00\nTributos recuperáveis: R$ 40.000,00\nTributos não recuperáveis: R$ 10.000,00\n\n\nSabendo que a empresa Eucalipto S.A. revendeu todo o lote de madeira por R$ 600.000,00 à vista, o resultado bruto apurado nesta operação pela empresa Eucalipto S.A. foi, em reais,", "options": {"A": "300.000,00.", "B": "250.000,00.", "C": "210.000,00.", "D": "200.000,00.", "E": "240.000,00."}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: 240.000,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 57, "source": "FCC - Esp RT (ARTESP)/ARTESP/Ciências Contábeis/2017", "statement": "Em determinado mês, a companhia É Biscoito S.A., revendedora de biscoitos confeitados, adquiriu mercadorias para revenda incorrendo nos seguintes gastos:\n \n\n− Mercadorias: R$ 20.000,00 (valor líquido dos tributos)\n \n\n− Fretes: R$1.200,00 (valor líquido dos tributos)\n \n\n− Seguros: R$ 400,00\n \n\n− ICMS: R$ 1.000,00\n \n\nNeste mesmo mês, a Cia. vendeu todos os produtos adquiridos por R$ 40.000,00 à vista, com desconto de 5%, e incorreu em despesa com frete para entrega das mercadorias no valor de R$ 300,00. Sabendo que a companhia é contribuinte do ICMS, o Custo das Mercadorias Vendidas e o Lucro Bruto apurados pela É Biscoito S.A., no referido mês, foram, respectivamente, em reais,", "options": {"A": "22.600,00 e 15.400,00.", "B": "22.600,00 e 17.100,00.", "C": "21.600,00 e 16.100,00.", "D": "21.600,00 e 16.400,00.", "E": "21.200,00 e 16.100,00."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 21.600,00 e 16.400,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 58, "source": "FCC - AJ TRF3/TRF 3/Apoio Especializado/Contadoria/2016", "statement": "Um lote de mercadorias foi adquirido do exterior para comercialização no Brasil. A compra ocorreu em 15/10/2015 e o preço pago ao fornecedor no exterior foi R$ 6.000.000,00, sendo que a empresa pagou, adicionalmente, os seguintes encargos para dispor das mercadorias em condições de venda:\n\n\n− R$ 600.000,00 de transporte aéreo para trazer a mercadoria do país de origem até o Brasil.\n− R$ 240.000,00 de taxas e tarifas alfandegárias para ingresso das mercadorias no Brasil.\n− R$ 100.000,00 para transporte da mercadoria do aeroporto até a sede da empresa.\n− R$ 150.000,00 correspondente aos seguintes impostos:\n− R$ 60.000,00 a título de imposto de importação não recuperável.\n− R$ 90.000,00 a título de outros impostos locais que podem ser compensados com os impostos incidentes no momento da venda das mercadorias.\n\n\nSabe-se que não havia saldo de estoque antes desta compra e que, em dezembro de 2015, a empresa vendeu noventa por cento das mercadorias que foram importadas. O valor bruto das vendas foi R$ 8.500.000,00 e os impostos incidentes sobre estas vendas totalizaram R$ 1.275.000,00. O Resultado Bruto com Mercadorias apurado pela empresa no ano de 2015, exclusivamente em relação às mercadorias importadas e vendidas, foi, em reais,", "options": {"A": "3.100.000,00.", "B": "844.000,00.", "C": "925.000,00.", "D": "979.000,00.", "E": "1.015.000,00."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 925.000,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 59, "source": "FCC - PS (ELETROSUL)/ELETROSUL/Ciências Contábeis/2016", "statement": "A empresa comercial Inovação S.A. teve a alíquota de ICMS alterada de 12% para 18%. Considerando que o preço de venda do produto é de R$ 100,00, o valor em reais que a entidade deverá aumentar ou diminuir o seu preço de venda para absorver o impacto da variação do ICMS, em reais, é", "options": {"A": "− 9,32", "B": "7,32", "C": "− 19,32", "D": "107,32", "E": "88,00"}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 7,32\n\nFundamentação: Verifique se cada tributo é recuperável e qual regime tributário se aplica. Em regra, tributos recuperáveis geram direito a crédito e não integram o custo do estoque; tributos não recuperáveis integram o custo quando diretamente atribuíveis à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 60, "source": "FCC - AFRE (SEFAZ MA)/SEFAZ MA/Administração Tributária/2016", "statement": "Os estoques de uma empresa são controlados pelo Sistema de Inventário Permanente e mensurados pelo critério da Média Ponderada Móvel. Durante o ano de 2015, a empresa realizou, em ordem cronológica, as seguintes transações com compra e venda de mercadorias:\n \nData \tOperação \t\n\nQuantidade\n\n(unidades)\n\t\n\nPreço unitário de\n\ncompra (R$)\n\t\n\nPreço unitário de\n\nvenda (R$)\n02/03/2015 \tCompra \t500 \t100,00 \t \n06/04/2015 \tVenda \t200 \t- \t140,00\n13/05/2015 \tCompra \t100 \t96,00 \t \n21/08/2015 \tVenda \t200 \t- \t144,00\n29/11/2015 \tCompra \t100 \t96,00 \t \n \n\nSabendo que a empresa não detinha estoque inicial, o valor do Estoque apresentado no Balanço Patrimonial de 31/12/2015 foi, em reais:", "options": {"A": "29.400,00.", "B": "29.200,00.", "C": "29.600,00.", "D": "69.200,00.", "E": "39.800,00."}, "answer": "A", "explanation": "Gabarito fornecido: A.\n\nAlternativa indicada: 29.400,00.\n\nFundamentação: Apure o custo das unidades disponíveis (estoque inicial + entradas líquidas), determine o custo unitário pelo critério informado e multiplique pela quantidade vendida ou remanescente. Ao final, compare o saldo do estoque com o valor realizável líquido.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}], [{"number": 61, "source": "FCC - AFRE (SEFAZ MA)/SEFAZ MA/Administração Tributária/2016", "statement": "Um lote de mercadorias foi adquirido à vista por uma empresa em 31/10/2015. O valor total da compra foi R$ 1.120.000,00 e engloba um imposto compensável pela empresa no valor de R$ 120.000,00. Em 18/12/2015 a empresa vendeu 70% dessas mercadorias por R$ 900.000,00 à vista e no valor total da venda está incluído um imposto sobre vendas de R$ 90.000,00. O valor do Resultado Bruto com Mercadorias reconhecido no resultado de 2015, exclusivamente em relação a estas mercadorias vendidas, foi, em reais:", "options": {"A": "116.000,00.", "B": "26.000,00.", "C": "200.000,00.", "D": "110.000,00.", "E": "137.000,00."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 110.000,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 62, "source": "FCC - TRE (SEFAZ MA)/SEFAZ MA/Arrecadação e Fiscalização de Mercadorias em Trânsito/2016", "statement": "Atenção: Para responder à questão, considere as informações abaixo.\n\n \n\nA Empresa Atlanta S.A., antes da apuração do resultado do exercício de 2015, apresentava as seguintes contas e seus respectivos saldos em 31/12/2015, em reais:\n\n \nAções em Tesouraria \t2.500,00\nMarcas e Patentes \t22.000,00\nAdiantamento de Clientes \t25.000,00\nAjuste de Avaliação Patrimonial (saldo credor) \t12.000,00\nAlugueis Pagos Antecipadamente \t22.500,00\nCaixa e Equivalentes de Caixa \t15.000,00\nCapital Social \t230.000,00\nClientes \t250.000,00\nCusto das Mercadorias Vendidas \t210.000,00\nDepreciação Acumulada \t45.000,00\nDespesa com Alugueis \t45.000,00\nDespesa com EPCLD \t7.500,00\nDespesa com Salários \t75.000,00\nDespesa de Depreciação \t30.000,00\nDespesa Financeira \t6.500,00\nDespesas com Imposto de Renda e Contribuição Social sobre o Lucro \t33.000,00\nDevoluções de Vendas \t20.000,00\nEmpréstimos a Pagar \t160.000,00\nEstimativa para Crédito de Liquidação Duvidosa (EPCLD) \t7.500,00\nEstoques \t100.000,00\nFornecedores \t82.000,00\nInvestimentos Permanentes em Outras Empresas \t58.000,00\nMáquinas e Equipamentos \t300.000,00\nProvisões Trabalhistas \t105.000,00\nReceita Bruta de Vendas \t590.000,00\nReceita de Dividendos \t2.000,00\nReserva de Lucros a Realizar \t6.500,00\nReserva Legal \t12.000,00\nResultado Negativo de Equivalência Patrimonial \t10.000,00\nReversão de Provisões Trabalhistas \t40.000,00\nTributos sobre Vendas \t110.000,00\n\n \n\nConsidere ainda que os saldos de Estoques e Fornecedores em 31/12/2014 eram, respectivamente, R$ 90.000,00 e R$ 70.000,00; todas as compras de mercadorias para revenda foram realizadas a prazo; e o saldo da conta fornecedores, durante 2015, foi alterado exclusivamente pelas compras a prazo e pelos pagamentos realizados pela empresa Atlanta S.A. Desconsiderando os efeitos dos tributos sobre compras e sabendo que a empresa realiza inventário periódico dos estoques, o total das movimentações a crédito na conta Fornecedores em 2015 foi, em reais, de", "options": {"A": "210.000,00.", "B": "220.000,00.", "C": "200.000,00.", "D": "208.000,00.", "E": "198.000,00."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 220.000,00.\n\nFundamentação: CMV = estoque inicial + compras líquidas − estoque final. Em lote único, pode-se calcular custo de aquisição × percentual vendido. Custo de aquisição inclui frete e seguro de entrada e tributos não recuperáveis, excluindo tributos recuperáveis e descontos comerciais obtidos.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 63, "source": "FCC - TRE (SEFAZ MA)/SEFAZ MA/Arrecadação e Fiscalização de Mercadorias em Trânsito/2016", "statement": "Em 01/02/2016, a empresa comercial Filipinas S.A. adquiriu um lote de mercadorias para revenda pelo valor de R$ 80.000,00 a prazo. Além disso, teve gastos com fretes no valor de R$ 6.000,00 e com seguros no valor de R$ 2.000,00 para levar as mercadorias até o seu centro de distribuição. Em 10/02/2016, devido a erros de especificação do pedido, o fornecedor concedeu à empresa um abatimento no valor de R$ 4.000,00. No dia 01/03/2016, metade do lote de mercadorias foi vendido por R$ 70.000,00 para pagamento em 60 dias. Em 31/03/2016, pelo pagamento antecipado do valor de R$ 70.000,00, foi concedido um desconto de R$ 1.400,00. Com base nessas informações e desconsiderando os efeitos dos tributos, o resultado bruto com a venda de mercadorias no primeiro trimestre de 2016 foi, em reais, de", "options": {"A": "26.600,00.", "B": "28.000,00.", "C": "32.000,00.", "D": "26.000,00.", "E": "24.600,00."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 28.000,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 64, "source": "FCC - TRE (SEFAZ MA)/SEFAZ MA/Tecnologia da Informação/2016", "statement": "Determinada empresa comercial apresentava os seguintes saldos:\n\n \n\n− Estoque inicial de 2015: R$ 50.000,00\n\n \n\n− Estoque final de 2015: R$ 70.000,00\n\n \n\n− Saldo inicial de Fornecedores de 2015: R$ 80.000,00\n\n \n\n− Saldo final de Fornecedores de 2015: R$ 30.000,00\n\n \n\n− Custo das Mercadorias Vendidas em 2015: R$ 830.000,00\n\n \n\nSabendo que a empresa apenas compra e revende os produtos, que a conta Fornecedores foi utilizada apenas para o registro das compras, as quais são realizadas todas a prazo e que não há tributos recuperáveis nas compras realizadas, o valor dos pagamentos realizados aos fornecedores em 2015 foi, em reais, de", "options": {"A": "900.000,00.", "B": "850.000,00.", "C": "880.000,00.", "D": "860.000,00.", "E": "50.000,00."}, "answer": "A", "explanation": "Gabarito fornecido: A.\n\nAlternativa indicada: 900.000,00.\n\nFundamentação: CMV = estoque inicial + compras líquidas − estoque final. Em lote único, pode-se calcular custo de aquisição × percentual vendido. Custo de aquisição inclui frete e seguro de entrada e tributos não recuperáveis, excluindo tributos recuperáveis e descontos comerciais obtidos.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 65, "source": "FCC - Ass Tec (Pref Teresina)/Pref Teresina/Administrativo/Técnico Contábil/2016", "statement": "A empresa Comércio & Comércio S.A. adquiriu, em 02/01/2016, mercadorias para serem revendidas no valor de R$ 250.000,00, pagando 40% em fevereiro e o restante em março de 2016. No dia 5 de fevereiro de 2016, a empresa vendeu 80% dessas mercadorias por R$ 380.000,00, recebendo 50% à vista e o restante em março de 2016. Desconsiderando os efeitos tributários, o resultado apurado pela empresa Comércio & Comércio S.A. com a venda destas mercadorias foi, em reais,", "options": {"A": "130.00,00 em fevereiro de 2016.", "B": "90.000,00 em fevereiro de 2016.", "C": "180.000,00 em fevereiro de 2016.", "D": "90.000,00 em fevereiro de 2016 e 40.000,00 em março de 2016.", "E": "110.000,00 em fevereiro de 2016 e 70.000,00 em março de 2016."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 180.000,00 em fevereiro de 2016.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 66, "source": "FCC - AFFE (SEFAZ PI)/SEFAZ PI/2015", "statement": "Um lote de mercadorias para revenda foi adquirido com pagamento à vista, em 30/10/2013, pelo valor de R$ 1.000.000,00. A empresa compradora retirou as mercadorias no depósito do fornecedor que se localiza a 1.500 km da sua sede e incorreu em gastos com o frete para levar estas mercadorias até o seu depósito, no valor total de R$ 20.000,00. A empresa compradora incorreu também em gastos no valor de R$ 10.000,00 na contratação de um seguro contra roubo das mercadorias durante o transporte do depósito do fornecedor até o seu depósito.\n\n\nSabendo-se que, em 25/11/2013, a empresa  vendeu 80% do lote de mercadorias que havia comprado em 30/10/2013 pelo valor de R$ 950.000,00 e supondo que não há incidência de qualquer tributo na compra e na venda das mercadorias, a empresa apresentará na Demonstração do Resultado de 2013, em relação exclusivamente à compra e à venda deste lote de mercadorias, os seguintes efeitos, em reais:", "options": {"A": "Resultado Bruto com Vendas = 150.000,00; Despesa com Vendas = 30.000,00", "B": "Resultado Bruto com Vendas = 150.000,00; Despesa com Frete = 20.000,00; Despesa com Seguro = 10.000,00", "C": "Resultado Bruto com Vendas = 134.000,00; Despesa com Seguro = 10.000,00", "D": "Resultado Bruto com Vendas = 126.000,00", "E": "Resultado Bruto com Vendas = 142.000,00; Despesa com Frete = 20.000,00"}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: Resultado Bruto com Vendas = 126.000,00\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 67, "source": "FCC - AFFE (SEFAZ PI)/SEFAZ PI/2015", "statement": "Uma empresa comercial realizou, durante o ano de 2012, as seguintes transações de compra e venda de mercadorias, em ordem cronológica:\n \nData \tTransação\n15/01 \tCompra de 10.000 unidades ao preço unitário de R$ 5,00.\n10/02 \tPagamento de frete pela compra de 15/01 no valor total de R$ 2.000,00.\n18/05 \tCompra de 10.000 unidades ao preço unitário de R$ 6,00.\n30/05 \tVenda de 10.000 unidades pelo valor total de R$ 60.500,00.\n20/06 \tDevolução de 1.000 unidades da compra de 15/01 por apresentarem defeitos de fabricação.\n18/09 \tConcessão de um abatimento de R$ 500,00 na venda realizada em 30/05.\n \n\nA empresa adota o Método da Média Ponderada Móvel para a avaliação do estoque e início do ano de 2012 não mantinha estoque de mercadorias. Supondo que não há incidência de qualquer tributo na compra e venda das mercadorias, o valor evidenciado para a conta Estoque no Balanço Patrimonial de 31/12/2012 e o Resultado Bruto com Vendas apresentado na Demonstração do Resultado de 2012 foram, respectivamente, em reais,", "options": {"A": "50.000,00 e 5.500,00.", "B": "51.000,00 e 4.500,00.", "C": "50.000,00 e 5.000,00.", "D": "50.000,00 e 3.000,00.", "E": "51.000,00 e 4.000,00"}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: 51.000,00 e 4.000,00\n\nFundamentação: Apure o custo das unidades disponíveis (estoque inicial + entradas líquidas), determine o custo unitário pelo critério informado e multiplique pela quantidade vendida ou remanescente. Ao final, compare o saldo do estoque com o valor realizável líquido.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 68, "source": "FCC - AFFE (SEFAZ PI)/SEFAZ PI/2015", "statement": "A empresa Comercializadora de Bugigangas S.A. atua na compra e venda de produtos populares e é contribuinte unicamente do ICMS. No início do ano de 2013, a empresa não tinha estoque de produtos e durante o ano de 2013 as seguintes transações de compra e venda de mercadorias foram realizadas:\n\n\n1. Compra de mercadorias no valor total de R$ 115.000,00, estando incluídos neste preço os valores de R$ 15.000,00 de IPI e R$ 12.000,00 de ICMS.\n\n\n2. A empresa vendeu 60% do estoque total disponível pelo preço de R$ 74.000,00 e, neste preço, já está incluído o valor de R$ 8.880,00 de ICMS incidente sobre a venda.\n\n\nO valor do Resultado Bruto com Vendas apresentado na Demonstração do Resultado de 2013 foi, em reais,", "options": {"A": "5.000,00.", "B": "3.320,00.", "C": "3.880,00.", "D": "12.320,00.", "E": "21.200,00."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 3.320,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 69, "source": "FCC - ATE (SEFAZ PI)/SEFAZ PI/2015", "statement": "Em 30/09/2012, uma empresa adquiriu mercadorias para revenda pelo valor de R$ 800.000,00. A empresa ficou responsável pela retirada das mercadorias no depósito do fornecedor e incorreu em gastos com frete no valor total de R$ 3.000,00 e também em gastos no valor de R$ 2.000,00 pela contratação de um seguro contra roubo das mercadorias durante o transporte do depósito do fornecedor até o seu depósito.\n\n\nSabe-se que, em 20/11/2012, a empresa vendeu 90% do lote de mercadorias que havia comprado em 30/09/2012 pelo valor de R$ 850.000,00. O valor do Estoque referente a este lote evidenciado no Balanço Patrimonial de 31/12/2012 foi, em reais:", "options": {"A": "80.000,00", "B": "80.300,00", "C": "80.200,00", "D": "80.500,00", "E": "85.000,00"}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 80.500,00\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 70, "source": "FCC - Aud CS (TMC-GO)/TCM GO/2015", "statement": "A Cia. Comerciante S.A. adquiriu mercadorias para serem comercializadas e pagou os seguintes valores:\n\n \n\nFornecedores de Mercadorias: ................................................................................................. R$ 390.000,00\nFrete para transporte até a empresa: .......................................................................................  R$   17.000,00\nSeguro das mercadorias: ..........................................................................................................R$    7.000,00\n\n \n\nNos valores pagos estavam incluídos tributos recuperáveis pela empresa no valor de R$ 48.000,00 e tributos não recuperáveis no valor de R$ 24.000,00.\n\n\nCom base nestas informações, o valor reconhecido como estoque referente às mercadorias adquiridas foi, em reais,", "options": {"A": "320.000,00.", "B": "342.000,00.", "C": "344.000,00.", "D": "366.000,00.", "E": "414.000,00."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 366.000,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}], [{"number": 71, "source": "FCC - ACE (TCM-GO)/TCM GO/Contábil/2015", "statement": "Uma empresa adquiriu, à vista, mercadorias para revenda, ficando responsável pela retirada das mesmas no depósito do fornecedor e incorrendo nos seguintes gastos:\n\n\n− Valor pago ao fornecedor: R$ 500.000,00.\n\n\n− Valor pago à transportadora das mercadorias: R$ 10.000,00\n\n\n− Valor do seguro pago para o transporte até seu próprio depósito: R$ 5.000,00\n\n\nA compra ocorreu em 25/09/2013 e a empresa vendeu 60% deste lote em 15/11/2013 pelo valor de R$ 475.000,00. Supondo que não há incidência de qualquer tributo na compra e na venda das mercadorias, a Demonstração do Resultado de 2013 evidenciará, em relação exclusivamente à compra e à venda deste lote de mercadorias:", "options": {"A": "Resultado Bruto com Vendas = R$ 160.000,00.", "B": "Resultado Bruto com Vendas = R$ 175.000,00; Despesa com frete = R$ 10.000,00 e Despesa com Seguro = R$ 5.000,00.", "C": "Resultado Bruto com Vendas = R$ 166.000,00.", "D": "Resultado Bruto com Vendas = R$ 169.000,00 e Despesa com Seguro = R$ 5.000,00.", "E": "Resultado Bruto com Vendas = R$ 172.000,00 e Despesa com Frete = R$ 10.000,00."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: Resultado Bruto com Vendas = R$ 166.000,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 72, "source": "FCC - ACE (TCM-GO)/TCM GO/Contábil/2015", "statement": "A Indústria Solar S.A. produz um único produto, cujos custos e despesas unitários, determinados com base na produção e venda de 1.000 unidades no período, estão apresentados, a seguir:\n \nCustos e Despesas \tR$\nMateriais diretos \t1.200,00\nMão de obra direta \t800,00\nCustos indiretos fixos \t900,00\nDespesas variáveis de vendas (comissões sobre vendas) \t200,00\nDespesas fixas de vendas \t300,00\nDespesas fixas administrativas \t400,00\nTotal por unidade \t3.800,00\n \n\nNo mês de novembro de 2014, não havia estoques iniciais e a empresa produziu e vendeu 900 unidades do seu produto pelo preço unitário líquido de vendas de R$ 4.100,00. O valor do lucro bruto unitário em novembro de 2014 foi, em reais,", "options": {"A": "1.200,00.", "B": "1.900,00.", "C": "200,00.", "D": "1.100,00.", "E": "900,00."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 1.100,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 73, "source": "FCC - JATTE (SEFAZ PE)/SEFAZ PE/2015", "statement": "A empresa Verde & Azul S.A. adquiriu, em 01/12/2014, mercadorias para serem revendidas aos seus clientes. As mercadorias foram adquiridas à vista por R$ 200.000,00, sendo que neste valor estavam incluídos tributos recuperáveis no valor de R$ 30.000,00 e tributos não recuperáveis no valor de R$ 23.000,00. Adicionalmente, a empresa Verde & Azul S.A. contratou e pagou o valor de R$ 8.000,00 pelo transporte destas mercadorias adquiridas até o seu depósito, sendo que neste valor estavam incluídos tributos recuperáveis no valor de R$ 1.000,00. Em 30/12/2014, a empresa Verde & Azul S.A. revendeu todos estes produtos por R$ 420.000,00, à vista, e sobre o valor da venda houve incidência de impostos no valor de R$ 63.000,00. Com base nestas informações, o lucro bruto apurado pela empresa em dezembro de 2014 foi, em reais,", "options": {"A": "220.000,00.", "B": "357.000,00.", "C": "157.000,00.", "D": "180.000,00.", "E": "203.000,00."}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: 180.000,00.\n\nFundamentação: Lucro bruto = receita líquida de vendas − custo das mercadorias vendidas (CMV). Receita líquida = receita bruta − descontos incondicionais − tributos sobre vendas. O CMV incorpora o custo das mercadorias efetivamente vendidas. Comissões, frete de entrega ao cliente e despesas administrativas não são deduzidos na apuração do lucro bruto.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 74, "source": "FCC - AP (MANAUSPREV)/MANAUSPREV/Contabilidade/2015", "statement": "Durante o segundo trimestre de 2014, a Cia. Campos Verdes realizou algumas transações, após as quais o Balancete da Cia. apresentava as seguintes contas com os respectivos saldos em reais:\n\n \n\n \n\nSabendo-se que, no segundo trimestre de 2014, o valor das compras reconhecido como estoque foi R$ 70.000,00, o estoque inicial de produtos  indicada: R$ 1.370,00\n\nFundamentação: Apure o custo das unidades disponíveis (estoque inicial + entradas líquidas), determine o custo unitário pelo critério informado e multiplique pela quantidade vendida ou remanescente. Ao final, compare o saldo do estoque com o valor realizável líquido.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 78, "source": "FCC - ALC (CM Pres Prudente)/CM Pres Prudente/2026", "statement": "Atenção: Considere os dados a seguir para responder à questão:\n \n\nA empresa “ABC” S/A é uma empresa de varejo de itens de cama, mesa e banho. Abaixo, segue a ficha de controle de estoque de toalhas para banho referente ao mês de maio do ano X1:\n \nDatas \tTipo de transação \tQuantidade \tCusto unitário (em R$)\nSaldo inicial em 01/05/X1 \t  \t60 \t12\n02/05/X1 \tCompra \t30 \t15\n10/05/X1 \tCompra \t10 \t20\n15/05/X1 \tVenda \t80 \t \n21/05/X1 \tCompra \t20 \t22\n28/05/X1 \tVenda \t30 \t \n \n\nO preço de venda líquido unitário das toalhas foi de R$ 30,00 para o mês de maio. 60% das vendas realizadas ao longo do mês foram feitas à vista, e o restante foi feito a prazo (expectativa de recebimento ao final de junho). A empresa adota o critério “Primeiro a Entrar, Primeiro a Sair” (PEPS) para valoração de estoques.\n \n\nO Custo da Mercadoria Vendida (CMV) referente à venda realizada em 15/05/X1 foi de", "options": {"A": "(R$ 1.130,00)", "B": "(R$ 1.096,00)", "C": "(R$ 1.370,00)", "D": "(R$ 350,00)", "E": "(R$ 1.020,00)"}, "answer": "E", "explanation": "Gabarito fornecido: E.\n\nAlternativa indicada: (R$ 1.020,00)\n\nFundamentação: Apure o custo das unidades disponíveis (estoque inicial + entradas líquidas), determine o custo unitário pelo critério informado e multiplique pela quantidade vendida ou remanescente. Ao final, compare o saldo do estoque com o valor realizável líquido.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 79, "source": "FCC - Ag Tec (MPE AM)/MPE AM/Contador/2024", "statement": "A empresa Porteira é responsável pela comercialização de um tipo específico de xícara de café. Em 06/01/2023, a empresa adquiriu 200 xícaras, a prazo, pelo preço unitário de R$ 8,00; porém, em virtude do volume, obteve um desconto financeiro de 10% sobre o valor total da compra. Em 11/01/2023, a empresa optou pela devolução de 10 xícaras da compra anterior, visto que vieram com avarias. Isso gerou um abatimento de R$ 72,00 no valor da compra. Em 20/01/2023, a empresa fez uma nova aquisição de mercadorias; dessa vez, foram compradas 100 xícaras ao preço unitário de R$ 10,00. Em 30/01/2023. a empresa vendeu 250 xícaras por R$ 3.750,00. Considere que nenhuma outra venda foi realizada durante o mês de janeiro e que havia estoque Inicial de 20 xícaras, adquiridas por R$ 7,50 cada uma. Como a empresa Porteira adota o critério de valoração de estoques “Primeiro a entrar, primeiro a sair” (PEPS), o valor do Custo da Mercadoria Vendida (CMV) reconhecido na Demonstração de Resultado do Exercício da empresa, em 31/01/2023 é, em reais,", "options": {"A": "2.080,00.", "B": "1.918,00.", "C": "1.968,00.", "D": "2.078,00.", "E": "2.030,85."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: 1.918,00.\n\nFundamentação: Apure o custo das unidades disponíveis (estoque inicial + entradas líquidas), determine o custo unitário pelo critério informado e multiplique pela quantidade vendida ou remanescente. Ao final, compare o saldo do estoque com o valor realizável líquido.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 80, "source": "FCC - AFTri (J Guararapes)/Pref J Guararapes/2024", "statement": "A Pé na Jaca Ltda é uma empresa do segmento de higiene e limpeza. Em março de 2022, a empresa adquiriu dois lotes de sua principal mercadoria, o desinfetante. Os detalhes das transações são apresentados a seguir:\n \n\n- Em 06/03/2022, houve a aquisição de um lote de 200 unidades de seu Fornecedor 1 pelo valor total líquido de impostos recuperáveis de RS 1.800.00. A transação também envolveu custos de transporte no valor R$ 150,00. seguro de R$ 200.00 e manuseio de R$ 400.00:\n \n\n- Em 17/03/2022, houve a aquisição de outro lote de 100 unidades de seu Fornecedor 2, cujo valor total liquido de impostos recuperáveis foi de R$ 2.000,00, mas a empresa Pé na Jaca Ltda, conseguiu obter um desconto comercial de RS 200.00 e, em virtude de atraso na entrega das mercadorias. obteve também um abatimento de R$ 150,00.\n \n\nEm 28/03/2022, a empresa Pê na Jaca ltda, realizou uma venda de 220 unidades de desinfetantes ao seu principal cliente pelo valor total de R$ 4.400,00. Com base nas informações fornecidas e admitindo-se que não havia saldo de estoque remanescente do mês de fevereiro, o critério de avaliação de estoque de desinfetantes utilizado pela empresa Pê na Jaca ltda, e o custo unitário das mercadorias vendidas, de acordo com a NBC TG 16 (R2) - Estoques, são, respectivamente,", "options": {"A": "Custo médio ponderado - R$ 11.50.", "B": "Custo médio ponderado - R$ 14,00.", "C": "Custo específicos - R$ 12,75 para as unidades do primeiro lote e RS 16,50 para as unidades do segundo lote.", "D": "Último a entrar, primeiro a sair - R$ 16,50 para as unidades do segundo lote e R$10.75 para as unidades do primeiro lote.", "E": "Primeiro a entrar, primeiro a sair - R$ 10, 75 para as unidades do primeiro lote e RS 20,00 para as unidades do segundo lote."}, "answer": "B", "explanation": "Gabarito fornecido: B.\n\nAlternativa indicada: Custo médio ponderado - R$ 14,00.\n\nFundamentação: Pelo CPC 16, o custo do estoque inclui preço de aquisição, tributos não recuperáveis, transporte, manuseio e outros gastos diretamente atribuíveis à colocação das mercadorias na localização e condição atuais. Excluem-se tributos recuperáveis, despesas de venda e gastos administrativos não relacionados à aquisição.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}], [{"number": 81, "source": "FCC - Ana (COPERGÁS)/COPERGÁS/Administrador/2023", "statement": "A tabela abaixo demonstra as entradas de um tipo de cilindro de gás no estoque de uma empresa hipotética:\n\nAo receber o relatório de saídas desse mesmo cilindro, constatou-se:\n \n\n− 31/01/2023 − deram saída do estoque 60 unidades do cilindro P45.\n\n− 15/02/2023 − deram saída do estoque 80 unidades do cilindro P45.\n\n− 21/02/2023 − deram saída do estoque 60 unidades do cilindro P45.\n \n\nCom base nessas informações e fundamentado no método PEPS, o saldo financeiro total do estoque é, em reais, igual a:", "options": {"A": "6.600,00.", "B": "12.400,00.", "C": "8.600,00.", "D": "9.400,00.", "E": "10.800,00."}, "answer": "A", "explanation": "Gabarito fornecido: A.\n\nAlternativa indicada: 6.600,00.\n\nFundamentação: Apure o custo das unidades disponíveis (estoque inicial + entradas líquidas), determine o custo unitário pelo critério informado e multiplique pela quantidade vendida ou remanescente. Ao final, compare o saldo do estoque com o valor realizável líquido.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 82, "source": "FCC - AJ TRT4/TRT 4/Administrativa/Contabilidade/2022", "statement": "A empresa TempoBom vende guarda-chuvas. A referida empresa iniciou as atividades em 01/01/20X2 e apresentou as compras de seus estoques ao longo do primeiro semestre de operações, conforme a tabela abaixo.\n\nDatas das compras de estoque\n\tQuantidade \tCusto por unidade \t\n\nCusto total\n\n01/01/20X2\n\t600 \t$ 24,00 \t\n\n$ 14.400,00\n\n15/03/20X2\n\t500 \t$ 22,00 \t\n\n$ 11.000,00\n\n12/06/20X2\n\t400 \t$ 20,00 \t\n\n$ 8.000,00\n\nTotal do 1º semestre de 20X2\n\t1.500 \t  \t\n\n$ 33.400,00\n\nConsidere que a TempoBom tenha optado pelo sistema de controle de estoques como o “Primeiro que entra, primeiro que sai” (PEPS), e que a empresa vendeu 1.000 produtos até 30/06/20x2.\n \n\nO valor do Custo das Mercadorias Vendidas (CMV) da TempoBom para o primeiro semestre de 20X2 é de", "options": {"A": "$ 22.266,67", "B": "$ 33.400,00", "C": "$ 21.400,00", "D": "$ 23.200,00", "E": "$ 10.200,00"}, "answer": "D", "explanation": "Gabarito fornecido: D.\n\nAlternativa indicada: $ 23.200,00\n\nFundamentação: Apure o custo das unidades disponíveis (estoque inicial + entradas líquidas), determine o custo unitário pelo critério informado e multiplique pela quantidade vendida ou remanescente. Ao final, compare o saldo do estoque com o valor realizável líquido.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 83, "source": "FCC - Ass Leg (ALAP)/ALAP/Atividade Orçamentária e Financeira/Assistente de Contabilidade/2020", "statement": "São critérios de valoração de estoques, previstos no CPC 16 (R1) −– Estoques:", "options": {"A": "Valor de mercado atua de R$ 4.500,00 da compra realizada em 04/01.\n\n \n\nSabendo que não há incidência de qualquer tributo na compra e na venda das mercadorias, que a empresa adota o Método da Média Ponderada Móvel para avaliação dos estoques e utiliza o Sistema de Inventário Permanente para controle, o saldo na conta de estoque evidenciado, no Balanço de 31/01/2014, foi, em reais,", "options": {"A": "271.500,00.", "B": "269.500,00.", "C": "274.000,00.", "D": "276.000,00.", "E": "271.750,00."}, "answer": "C", "explanation": "Gabarito fornecido: C.\n\nAlternativa indicada: 274.000,00.\n\nFundamentação: Apure o custo das unidades disponíveis (estoque inicial + entradas líquidas), determine o custo unitário pelo critério informado e multiplique pela quantidade vendida ou remanescente. Ao final, compare o saldo do estoque com o valor realizável líquido.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}, {"number": 96, "source": "FCC - Téc Cont (DPE RR)/DPE RR/2015", "statement": "Uma empresa comercializa um único produto e não tinha saldo em estoque no início do ano de 2014. Durante o ano de 2014 realizou as transações com o produto que comercializa, as quais são apresentadas, em ordem cronológica, na tabela abaixo.\n\n \nTransação \tDescrição\n1 \tCompra de 100.000 unidades ao preço unitário de R$ 4,00.\n2 \tPagamento de frete pela compra da transação 1, no valor total de R$ 40.000,00.\n3 \tCompra de 100.000 unidades ao preço unitário de R$ 4,80.\n4 \tVenda de 100.000 unidades pelo valor total de R$ 121.000,00.\n5 \tDevolução de 10.000 unidades da compra efetuada na transação 1, por não atenderem às especificações desejadas pela empresa.\n6 \tConcessão de um abatimento de R$ 3.000,00 na venda definida na transação 4.\n\n \n\nSe a empresa adota o Método da Média Ponderada Móvel para a avaliação do estoque, o valor evidenciado para a conta Estoque no Balanço Patrimonial de 31/12/2014 foi, em reais,", "options": {"A": "420.000,00.", "B": "440.000,00.", "C": "400.000,00.", "D": "460.000,00.", "E": "417.000,00."}, "answer": "A", "explanation": "Gabarito fornecido: A.\n\nAlternativa indicada: 420.000,00.\n\nFundamentação: Apure o custo das unidades disponíveis (estoque inicial + entradas líquidas), determine o custo unitário pelo critério informado e multiplique pela quantidade vendida ou remanescente. Ao final, compare o saldo do estoque com o valor realizável líquido.\n\nMétodo Moreira: identifique primeiro o que a questão pede (estoque final, CMV, receita ou lucro bruto); depois separe os valores que entram no custo daqueles que são créditos tributários ou despesas do período. Por fim, confronte o resultado com as alternativas."}]];const TOTAL=96;const PREFIX='fcc_moreira_96_v1_';let quiz=-1,index=0;const $=id=>document.getElementById(id);let answers={};try{answers=JSON.parse(localStorage.getItem(PREFIX+'answers')||'{}')}catch(e){}function save(){try{localStorage.setItem(PREFIX+'answers',JSON.stringify(answers))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function button(label,fn,alt=false){let b=document.createElement('button');b.textContent=label;b.className=alt?'alt':'';b.onclick=fn;$('actions').append(b)}function menu(){quiz=-1;$('actions').innerHTML='';$('screen').innerHTML=`<div class="cover"><div class="eyebrow">BANCA FCC</div><h1>OPERAÇÕES COM MERCADORIAS</h1><h2>TREINAMENTO PESADO</h2><p>96 questões • 10 quizzes • Padrão Professor Moreira</p></div><div class="menu">${DATA.map((qs,i)=>{let done=qs.filter(q=>answers[q.number]!==undefined).length;return `<button class="quizbtn" onclick="start(${i})">QUIZ ${i+1}<br><small>${qs.length} questões • ${done} respondidas</small></button>`}).join('')}</div>`}function start(i){quiz=i;index=0;render()}function clearQuiz(){if(!confirm('Deseja apagar as respostas deste quiz e reiniciar?'))return;DATA[quiz].forEach(q=>delete answers[q.number]);save();index=0;render()}function render(){window.scrollTo(0,0);$('actions').innerHTML='';let qs=DATA[quiz];if(index>=qs.length){let hit=qs.filter(q=>answers[q.number]===q.answer).length;$('screen').innerHTML=`<div class="cover"><h1>QUIZ ${quiz+1} CONCLUÍDO!</h1><div class="score">${hit} / ${qs.length}</div><p>${Math.round(hit/qs.length*100)}% de aproveitamento</p><p>Quem quer ser aprovado estuda, quem não quer arranja desculpa!</p></div>`;button('⬅ Rever questões',()=>{index=qs.length-1;render()},true);button('↻ Refazer',clearQuiz);button('☰ Menu',menu,true);return}let q=qs[index],chosen=answers[q.number],answered=chosen!==undefined;$('screen').innerHTML=`<div class="head"><span>QUIZ ${quiz+1} · QUESTÃO ${index+1}/${qs.length}</span><span>GERAL ${q.number}/${TOTAL}</span></div><div class="source">${esc(q.source)}</div><div class="bar"><div style="width:${(index+1)/qs.length*100}%"></div></div><div class="stem">${esc(q.statement)}</div><div id="options"></div><div id="feedback"></div>`;for(let [letter,txt] of Object.entries(q.options)){let b=document.createElement('button');b.className='opt'+(answered?(letter===q.answer?' correct':letter===chosen?' wrong':''):'');b.disabled=answered;b.innerHTML='<strong>'+letter+')</strong> '+esc(txt);b.onclick=()=>{answers[q.number]=letter;save();render()};$('options').append(b)}if(answered){let ok=chosen===q.answer;$('feedback').innerHTML=`<div class="explain"><h3>${ok?'✅ ACERTOU! PARABÉNS!':'❌ ERROU! CONTINUE ESTUDANDO!'}</h3>${esc(q.explanation)}</div>`}button('⬅ Voltar',()=>{if(index===0)menu();else{index--;render()}},true);button(index===qs.length-1?'🏆 Ver escore':'Próxima ➡',()=>{index++;render()});button('↻ Reiniciar',clearQuiz,true);button('☰ Menu',menu,true)}menu();</script></body></html>
